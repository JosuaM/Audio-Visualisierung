<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morphologischer Kasten – Audio-Visualisierung</title>
<style>
:root {
  --bg: #f4f2ed; --panel: #fbfaf7; --ink: #1b1b22; --muted: #7b7a82; --faint: #a9a8ae;
  --line: #e3e0d8; --line-2: #cfcbc0; --accent: #ff6a14; --accent-ink: #fff; --pa: #ff6a14; --pb: #2563eb;
  --stage: #ebe8e0; --chip: #f3f1ec; --chip-h: #e9e6df;
  --grid: rgba(40,40,60,.08); --ctxp: rgba(110,108,124,.20); --ctxs: rgba(110,108,124,.45); --hide: #d6d2c7;
  --c0: #12985f; --c1: #2558e8; --c2: #d8304c; --c3: #d98400; --c4: #e5158f; --c5: #7a4cff; --c6: #0c95ad; --c7: #7ea000;
}
:root[data-theme="dark"] {
  --pa: #ff8a2a; --pb: #4f8dff;
  --bg: #0b0c10; --panel: #11131a; --ink: #eeeef2; --muted: #8b8d99; --faint: #5d5f6b;
  --line: #1f222c; --line-2: #2d313e; --accent: #ff8a2a; --accent-ink: #15120e;
  --stage: #07080b; --chip: #161922; --chip-h: #1d212c;
  --grid: rgba(220,225,255,.07); --ctxp: rgba(150,156,180,.13); --ctxs: rgba(150,156,180,.32); --hide: #1a1d27;
  --c0: #3ddc97; --c1: #5ba3ff; --c2: #ff5f76; --c3: #ffb454; --c4: #ff3fa6; --c5: #b88cff; --c6: #46d9ee; --c7: #d6f45c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 14px 16px;
  -webkit-font-smoothing: antialiased;
}

/* Kopfzeile */
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 4px; }
h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 span { color: var(--muted); font-weight: 450; }
.right { display: flex; align-items: center; gap: 10px; }

button, .btn { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
button:hover, .btn:hover { border-color: var(--muted); }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 30px; padding: 0; justify-content: center; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; height: 28px; background: transparent; color: var(--muted); padding: 0 10px; }
.seg button.on { background: var(--ink); color: var(--bg); }
select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 30px 0 10px; cursor: pointer; appearance: none; -webkit-appearance: none; }
.sel { position: relative; display: inline-flex; }
.sel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--muted); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); pointer-events: none; }

.trk { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.tempo b.fix { min-width: 0; }

/* Hauptlayout */
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(560px, 56vw, 960px); gap: 12px; min-height: 0; }
.left { display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto; gap: 10px; min-height: 0; min-width: 0; }
.stagebox { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--stage); min-height: 220px; }
.stagebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.badge { position: absolute; left: 12px; top: 10px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; backdrop-filter: blur(6px); pointer-events: none; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.badge b { color: var(--ink); font-weight: 600; }
.badge em { font-style: normal; color: var(--accent); }
.preview-tag { position: absolute; right: 12px; top: 10px; font-size: 11px; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 3px 10px; opacity: 0; transition: opacity .15s; pointer-events: none; }
.preview-tag.on { opacity: 1; }
.zoomctl { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(6px); z-index: 2; }
.zoomctl button { width: 28px; height: 26px; padding: 0; border: 0; background: transparent; justify-content: center; color: var(--muted); }
.zoomctl button:hover { color: var(--ink); background: var(--chip-h); }
.zoomctl #zReset { width: auto; padding: 0 8px; font-size: 11.5px; font-variant-numeric: tabular-nums; min-width: 52px; }

.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar .grp { display: flex; gap: 8px; margin-left: auto; }
.tempo { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.tempo b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 54px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 96px; height: 14px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: var(--line-2); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); margin-top: -5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); border: 0; }
.meters { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: var(--faint); }
.meter { display: flex; align-items: center; gap: 5px; }
.meter span { width: 38px; }
.meter div { width: 70px; height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter div i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
.meters.off { display: none; }

.seek { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.seek .sw2 { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.seek .sw2 input[type=range] { flex: 1; width: 100%; min-width: 0; position: relative; z-index: 1; }
.seek .marks { position: absolute; left: 6.5px; right: 6.5px; top: 50%; height: 9px; margin-top: -4.5px; pointer-events: none; }
.seek .marks i { position: absolute; top: 0; bottom: 0; min-width: 2px; border-radius: 2px; background: var(--mc); opacity: .55; }
.seek .mlab { font-size: 11px; color: var(--mc, var(--muted)); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.seek .mlab::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--mc); opacity: .7; }
.seek .mlab:empty { display: none; }
.seek input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line-2) var(--p, 0%)); }
.seek input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--accent); }
.seek b { color: var(--ink); font-weight: 600; }
.seek .t1 { min-width: 82px; text-align: right; }
.notes { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; }
.note { font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 999px; padding: 2px 10px; }
.note b { color: var(--ink); font-weight: 600; }


/* Kasten-Panel */
.panel { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; }
.tabs button.t { flex: 1; border: 0; background: transparent; color: var(--muted); height: 30px; justify-content: center; }
.tabs button.t.on { background: var(--ink); color: var(--bg); }
.tabs button.t b { font-weight: 600; margin-right: 2px; }
.tabs .eye { border-color: var(--line); }
.tabs .eye.on { color: var(--accent); border-color: var(--accent); }
.scroll { overflow: auto; padding: 0 14px 30px; }
.box { padding: 16px 0 48px; border-bottom: 1px solid var(--line); }
.box:last-child { border-bottom: 0; padding-bottom: 12px; }
.box + .box { padding-top: 48px; }
.bh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bh h2 { font-size: 13.5px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.bh h2 span { color: var(--muted); font-weight: 450; }
.bq { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }
.acts { display: flex; gap: 4px; }
.acts button { height: 24px; font-size: 11.5px; padding: 0 8px; border-color: var(--line); color: var(--muted); }
.acts button:hover { color: var(--ink); }
.rows { position: relative; }
.rows svg.path { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
.row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; padding: 5px 0; align-items: stretch; position: relative; border-radius: 8px; }
.row.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }
.rl { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.rl .nm { display: flex; align-items: center; gap: 4px; font-weight: 560; font-size: 12px; line-height: 1.25; }
.rl .nm .tx { min-width: 0; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
.rl .nm .opt { color: var(--faint); font-weight: 400; font-size: 10.5px; }
.rl small { color: var(--faint); font-size: 10.5px; line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; hyphens: auto; -webkit-hyphens: auto; }
.lock { width: 18px; height: 18px; padding: 0; border: 0; background: transparent; color: var(--faint); opacity: 0; justify-content: center; flex: none; margin-left: -3px; }
.lock svg { width: 12px; height: 12px; }
.row:hover .lock, .lock.on, .lock:focus-visible { opacity: 1; }
.lock.on { color: var(--accent); }
.opts { display: flex; position: relative; width: 100%; z-index: 1; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--bg); }
.chip { flex: 0 0 calc(100% / var(--cols, 7) - .15px); min-width: 0; height: auto; min-height: 36px; padding: 4px 3px; border: 0; border-left: 1px solid var(--line-2); border-radius: 0; background: transparent; font-size: 11.5px; line-height: 1.2; color: var(--ink); gap: 4px; justify-content: center; text-align: center; white-space: normal; overflow-wrap: anywhere; hyphens: auto; }
.chip:first-child { border-left: 0; }
.chip:hover { background: var(--chip-h); }
.chip.on { background: var(--selc, var(--accent)); color: #fff; font-weight: 650; }
.chip.empty { pointer-events: none; }
.chip.empty:hover { background: transparent; }
.chip.pa, .chip.pb { color: #fff; font-weight: 650; }
.chip.pa { background: var(--pa); }
.chip.pb { background: var(--pb); }
.chip.pa.pb { background: linear-gradient(135deg, var(--pa) 50%, var(--pb) 50%); }
.panel.cmp .chip:not(.empty) { cursor: default; }
.panel.cmp .chip:not(.pa):not(.pb):hover { background: transparent; }
/* Profile: Tonspur + Name + Speichern */
.prof { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prof .lbl { color: var(--muted); font-size: 12px; }
.prof select { height: 28px; }
.who { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.who button { border: 0; border-radius: 0; height: 26px; background: transparent; color: var(--muted); padding: 0 10px; gap: 6px; }
.who button + button { border-left: 1px solid var(--line-2); }
.who button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); opacity: .45; }
.who button.on { background: var(--c); color: #fff; }
.who [data-who="both"] i { border-radius: 2px; }
.who button.on i { background: #fff; opacity: 1; }
.prof .st { font-size: 11.5px; color: var(--faint); }
.prof .st.dirty { color: var(--muted); }
.prof .st b { font-weight: 600; }
.prof #psave { margin-left: auto; height: 28px; border-color: var(--selc, var(--accent)); color: var(--selc, var(--accent)); }
.prof #psave.ok { border-color: var(--line-2); color: var(--muted); }
.prof #psave[hidden] { display: none; }
.chip svg { display: none; }
.sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); flex: none; }
.derive { margin-top: 10px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 10px; }
.derive p { margin: 0; color: var(--muted); font-size: 11.5px; flex: 1; }
.derive button { border-color: var(--accent); color: var(--accent); }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; display: flex; gap: 12px; align-items: center; z-index: 10; }
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { height: 24px; font-size: 12px; background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }

@media (max-width: 1180px) { .hide-m { display: none; } }
@media (max-width: 980px) {
  html, body { height: auto; overflow: auto; }
  body { grid-template-rows: auto auto; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .left { grid-template-rows: auto auto auto auto; }
  .stagebox { height: 56vh; }
  .scroll { overflow: visible; }
  .tabs { position: sticky; top: 0; z-index: 3; background: var(--panel); }
  .box { scroll-margin-top: 48px; }
  .panel { overflow: visible; }
}
@media (max-width: 560px) {
  body { padding: 10px 16px; }
  h1 span { display: none; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .rl { flex-direction: row; gap: 8px; align-items: baseline; padding-top: 0; }
  .lock { opacity: 1; }
}
</style>
</head>
<body>

<header>
  <h1>Morphologischer Kasten <span>– Visuelle Erscheinung, Verhalten &amp; Klang</span></h1>
  <div class="right">
    <label class="trk" title="Auf welche Tonspur die Visualisierung reagiert: der ganze Song oder eine einzelne Instrumentenspur (auf der Visualisierungsseite pro Instrument hochladbar)">Tonspur
      <span class="sel"><select id="track" aria-label="Tonspur wählen"><option value="all">Alles (Original)</option></select></span>
    </label>
    <a class="btn" href="index.html" title="Zurück zur Visualisierung">
      <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="hide-m">Zur Visualisierung</span>
    </a>
    <button id="theme" class="icon" title="Dark / Light" aria-label="Dark / Light">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="left">
    <div class="stagebox" id="stagebox">
      <canvas id="stage" aria-label="Visualisierung der gewählten Kombination"></canvas>
      <div class="preview-tag" id="ptag">Vorschau</div>
      <div class="zoomctl" role="group" aria-label="Zoom">
        <button id="zOut" title="Rauszoomen" aria-label="Rauszoomen"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button id="zReset" title="Auf Standard zurücksetzen (Doppelklick in die Visualisierung)" aria-label="Zoom zurücksetzen">100 %</button>
        <button id="zIn" title="Reinzoomen" aria-label="Reinzoomen"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>

    <div class="seek" title="Position im Song – ziehen, um zu springen">
      <span class="mlab" id="seekLab"></span>
      <div class="sw2"><div class="marks" id="seekMarks"></div><input type="range" id="seek" min="0" max="66" step="0.01" value="0" aria-label="Position im Song"></div>
      <span class="t1"><b id="seekCur">0:00</b> / <span id="seekDur">1:06</span></span>
    </div>

    <div class="bar">
      <button id="play" class="icon" title="Abspielen / Pausieren (Leertaste)" aria-label="Abspielen / Pausieren"></button>
      <span class="tempo" title="Tempo des Songs – fest, wie auf der Visualisierungsseite">Tempo <b id="bpmv" class="fix"></b></span>
      <span class="tempo">Klang</span>
      <div class="seg" role="group" aria-label="Klangquelle" title="Worauf reagiert die Visualisierung? Synth spielt den Klang aus Kasten 3, Song spielt den Track ab.">
        <button data-src="off">Aus</button><button data-src="synth">Synth</button><button data-src="song" class="on">Song</button>
      </div>
      <div class="meters" id="meters">
        <div class="meter"><span>Pegel</span><div><i id="mAmp"></i></div></div>
        <div class="meter"><span>Tonhöhe</span><div><i id="mPitch"></i></div></div>
      </div>
      <div class="grp">
      <button id="rand" title="Zufällige Kombination für Kasten 1 &amp; 2 (R) – gesperrte Zeilen bleiben"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/></svg>Zufall</button>
      <button id="reset" class="icon" title="Alles auf Standard zurücksetzen" aria-label="Zurücksetzen"><svg class="i" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
      <button id="png" class="icon" title="Aktuelles Bild als PNG speichern" aria-label="Bild speichern"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg></button>
      <button id="boxpng" title="Alle drei Kästen als Bild exportieren (weißer Hintergrund, klassische Tabellen, Bewegungsspur)"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 4v16"/></svg>Kasten als Bild</button>
      </div>
    </div>

    <div class="notes" id="notes" aria-live="polite"></div>

  </section>

  <aside class="panel" id="panel">
    <div class="prof">
      <span class="lbl">Tonspur</span>
      <span class="sel"><select id="ptrack" aria-label="Tonspur für die Auswahl"></select></span>
      <div class="who" role="group" aria-label="Wessen Auswahl?">
        <button data-who="Jeremy" style="--c: var(--pa)" title="Auswahl von Jeremy"><i></i>Jeremy</button><button data-who="Josua" style="--c: var(--pb)" title="Auswahl von Josua"><i></i>Josua</button>
      </div>
      <div class="who" role="group" aria-label="Vergleich">
        <button data-who="both" style="--c: linear-gradient(135deg, var(--pa) 50%, var(--pb) 50%)" title="Auswahl von Jeremy &amp; Josua vergleichen"><i></i>Beide</button>
      </div>
      <span class="st" id="pstat"></span>
      <button id="psave" hidden><svg class="i" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Speichern</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="t on" data-go="look"><b>1</b>&nbsp;Erscheinung</button>
      <button class="t" data-go="move"><b>2</b>&nbsp;Verhalten</button>
      <button class="t" data-go="sound"><b>3</b>&nbsp;Klang</button>
      <button class="icon eye" id="hover" title="Vorschau beim Überfahren der Ausprägungen" aria-label="Hover-Vorschau an/aus"><svg class="i" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
    </div>
    <div class="scroll" id="scroll"></div>
  </aside>
</main>

<div id="toast"></div>

<script src="analysis.js"></script>
<script>
'use strict';

  if (el === 'Kreis' && ch === 'Unregelmäßig') add('Kreis + Unregelmäßig', 'verzogenes Vieleck');

/* Zoom in der Visualisierung: Finger auseinander = rein, zusammen = raus (Trackpad, Touch, Safari); Doppelklick = zurücksetzen */
{
  const box = $('stagebox'), ZMIN = .5, ZMAX = 8;
  const zoomAt = (f, px, py) => {
    const Z = main.zoom, k = Math.min(ZMAX, Math.max(ZMIN, Z.k * f)); f = k / Z.k;
    Z.x = px - (px - Z.x) * f; Z.y = py - (py - Z.y) * f; Z.k = k;

  const mid = () => { const r = box.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  $('zIn').onclick = () => zoomAt(1.25, ...mid());

  const local = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  box.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch' || e.target.closest('.zoomctl')) return; pts.set(e.pointerId, local(e)); if (pts.size === 2) pd = two()[0]; });

  for (const L of layers) {
    c.fillStyle = L.col; c.fillRect(lx, y - 8, 14, 10);
    const t = L.name ? `gewählt von ${L.name}` : 'gewählte Ausprägung'; c.fillStyle = MUTED; c.fillText(t, lx + 22, y - 2); lx += 22 + c.measureText(t).width + 24;
  }
  if (cmpSel) {
    c.fillStyle = layers[0].col; c.beginPath(); c.moveTo(lx, y - 8); c.lineTo(lx + 14, y - 8); c.lineTo(lx, y + 2); c.fill();
    c.fillStyle = layers[1].col; c.beginPath(); c.moveTo(lx + 14, y - 8); c.lineTo(lx + 14, y + 2); c.lineTo(lx, y + 2); c.fill();
    c.fillStyle = MUTED; c.fillText('von beiden gewählt', lx + 22, y - 2);
  }
  return out;
}
$('boxpng').onclick = () => {
  toast('Bild wird erstellt …');
  setTimeout(() => {
    try {
      const cvs = buildBoxImage();
      cvs.toBlob(b => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        const tag = [state.ptrack, ...(state.who.length ? state.who : [])].join('-').toLowerCase().replace(/[^a-z0-9äöüß-]+/g, '-');
        a.download = `morphologischer-kasten-${tag}.png`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Bild gespeichert');
      }, 'image/png');
    } catch (e) { console.error(e); toast('Export fehlgeschlagen: ' + e.message); }
  }, 40);
};

/* Toast */
let toastT = 0;
function toast(msg, act, fn) {
  const t = $('toast'); t.innerHTML = `<span>${msg}</span>` + (act ? `<button>${act}</button>` : '');
  if (act) t.querySelector('button').onclick = () => { fn(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), act ? 5000 : 2600);
}

/* Theme */
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('av-theme', t); } catch (e) {} main.readTheme(); }
{ let t; try { t = localStorage.getItem('av-theme'); } catch (e) {} document.documentElement.dataset.theme = t || 'dark'; main.readTheme(); }
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* Tastatur */
addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); setPlay(!playing); }
  if (e.key === 'r' || e.key === 'R') randomize(['look', 'move']);
});

/* Größe */
const ro = new ResizeObserver(() => { main.resize(); drawPaths(); });
ro.observe($('stagebox')); ro.observe(scrollEl);

/* Hauptschleife */
let last = performance.now(), T = 0, frameNo = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; frameNo++;
  if (sound.mode === 'song' && sound.audio && !sound.audio.paused) T = sound.audio.currentTime;   // Takt/Rhythmus laufen mit dem Song
  else if (playing && sound.mode !== 'song') T += dt;
  showSeek(sound.audio && sound.audio.readyState >= 1 ? sound.audio.currentTime : T % songDur());
  const feat = sound.features();
  main.frame(T, playing ? dt : 0, feat);
  if (feat) { $('mAmp').style.width = (feat.amp * 100).toFixed(0) + '%'; $('mPitch').style.width = (feat.pitch * 100).toFixed(0) + '%'; }
  requestAnimationFrame(loop);
}

/* Tonspur-Auswahl */
const trackSel = $('track');
async function fillTracks() {
  const names = (await Stems.names()).sort(), cur = trackSel.value;
  trackSel.innerHTML = '<option value="all">Alles (Original)</option>' + names.map(n => `<option value="${String(n).replace(/"/g, '&quot;')}">${n}</option>`).join('');
  trackSel.value = names.includes(cur) ? cur : 'all';
  fillPTrack(names);
}
trackSel.onchange = async () => { const v = trackSel.value; if (!(await sound.setTrack(v))) { trackSel.value = sound.track; return; } toast(v === 'all' ? 'Visualisierung reagiert auf den ganzen Song' : `Visualisierung reagiert nur auf die Spur „${v}“`); };
fillTracks(); addEventListener('focus', fillTracks); document.addEventListener('visibilitychange', () => { if (!document.hidden) fillTracks(); });

/* Start */
setBpm(SONG.bpm);
sound.mode = 'song';
main.resize();
loadProfile();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPaths);
</script>
