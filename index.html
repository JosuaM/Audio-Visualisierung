<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blade Runner 20 – Audio-Visualisierung</title>
<style>
:root {
  --bg: #f4f2ed; --panel: #fbfaf7; --ink: #1b1b22; --muted: #7b7a82; --faint: #a9a8ae;
  --line: #e3e0d8; --line-2: #cfcbc0; --grid: #e9e6de; --accent: #ff6a14;
  --hero: #efece5;
  --c0: #12985f; --c1: #2558e8; --c2: #d8304c; --c3: #d98400; --c4: #e5158f; --c5: #7a4cff; --c6: #0c95ad; --c7: #7ea000;
  --wave: rgba(30,30,44,.78);
}
:root[data-theme="dark"] {
  --bg: #0b0c10; --panel: #11131a; --ink: #eeeef2; --muted: #8b8d99; --faint: #5d5f6b;
  --line: #1f222c; --line-2: #2d313e; --grid: #181b24; --accent: #ff8a2a;
  --hero: #0e1017;
  --c0: #3ddc97; --c1: #5ba3ff; --c2: #ff5f76; --c3: #ffb454; --c4: #ff3fa6; --c5: #b88cff; --c6: #46d9ee; --c7: #d6f45c;
  --wave: rgba(238,238,250,.8);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }

/* Kopfzeile */
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 4px; }
.title { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.title h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.title h1 span { color: var(--muted); font-weight: 450; }
.facts { display: flex; gap: 6px; flex-wrap: wrap; }
.fact { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--panel); white-space: nowrap; }
.fact b { color: var(--ink); font-weight: 600; }
.right { display: flex; align-items: center; gap: 8px; }

button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 12px; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; height: 28px; background: transparent; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
.icon { width: 30px; padding: 0; display: grid; place-items: center; }
.icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* DAW */
#daw { display: flex; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
#labels { flex: 0 0 118px; border-right: 1px solid var(--line); background: var(--panel); position: relative; z-index: 3; }
#labels .l { display: flex; align-items: center; gap: 9px; padding-left: 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 12.5px; }
#labels .l i { width: 3px; height: 14px; border-radius: 2px; background: var(--c); }
#labels .l.hero { align-items: flex-start; padding-top: 11px; flex-direction: column; gap: 2px; }
#labels .l.hero small { color: var(--muted); font-weight: 450; font-size: 11px; }
#labels .l.ruler { color: var(--faint); font-weight: 500; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; }
#scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
#stage { position: relative; user-select: none; touch-action: none; }
#ruler { position: absolute; left: 0; top: 0; cursor: pointer; }
#hero { position: absolute; left: 0; background: var(--hero); border-bottom: 1px solid var(--line); cursor: pointer; }
#hero canvas { position: absolute; left: 0; top: 0; }
#played { position: absolute; left: 0; top: 0; bottom: 0; overflow: hidden; width: 0; }
#body, #heroGrid { position: absolute; left: 0; }
#heroGrid { pointer-events: none; }
#body .fixed { pointer-events: none; }
#body .el { cursor: grab; }
#body .el.drag { cursor: grabbing; }
#body .hit { fill: transparent; stroke: transparent; }
#body .el:hover .hit, #body .el.sel .hit { fill: color-mix(in srgb, var(--c) 9%, transparent); stroke: color-mix(in srgb, var(--c) 40%, transparent); stroke-dasharray: 3 3; }
.gM { stroke: var(--line-2); } .gm { stroke: var(--grid); } .gb { stroke: var(--grid); stroke-opacity: .55; } .rs { stroke: var(--line); }
#heroGrid .gM { opacity: .5; } #heroGrid .gm, #heroGrid .gb { stroke: var(--line-2); opacity: .2; }
#playhead { position: absolute; top: 0; bottom: 0; width: 0; pointer-events: none; z-index: 4; }
#playhead::after { content: ""; position: absolute; top: 0; bottom: 0; left: -.75px; width: 1.5px; background: var(--accent); }
#playhead::before { content: ""; position: absolute; top: 0; left: -6px; border: 6px solid transparent; border-top: 9px solid var(--accent); border-bottom: 0; }
#tip { position: absolute; z-index: 5; pointer-events: none; font-size: 11px; background: var(--ink); color: var(--bg); padding: 2px 7px; border-radius: 6px; transform: translate(-50%, -125%); white-space: nowrap; display: none; }

/* Transport */
#transport { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.tl { display: flex; align-items: center; gap: 12px; }
#play { width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
#play:hover { background: var(--accent); }
#play svg { width: 18px; height: 18px; fill: currentColor; }
#play .p2 { display: none; } #play.on .p1 { display: none; } #play.on .p2 { display: block; }
.clock { min-width: 168px; }
.clock b { font-size: 21px; font-weight: 600; letter-spacing: -.01em; display: block; line-height: 1.15; }
.clock span { color: var(--muted); font-size: 12px; }
#eq { width: 100%; height: 44px; display: block; }
.tr { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
input[type=range] { width: 120px; accent-color: var(--accent); }
.hint { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
kbd { font: 10.5px ui-monospace, Consolas, monospace; color: var(--muted); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg); }
@media (max-width: 1100px) { .hint, #eq { display: none; } #transport { grid-template-columns: 1fr auto; } }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>Synthwave goose <span>–</span> Blade Runner 20</h1>
    <div class="facts" id="facts"></div>
  </div>
  <div class="right">
    <span class="hint"><kbd>Leertaste</kbd> Play/Pause &nbsp; <kbd>←</kbd><kbd>→</kbd> Spulen</span>
    <div class="seg" role="group" aria-label="Anzeige">
      <button id="m-bars" class="on">Takte</button><button id="m-time">Zeit</button>
    </div>
    <button id="theme" class="icon" title="Dark / Light" aria-label="Dark / Light">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
    </button>
  </div>
</header>

<div id="daw">
  <div id="labels"></div>
  <div id="scroll"><div id="stage"></div></div>
</div>

<div id="transport">
  <div class="tl">
    <button id="play" aria-label="Abspielen / Pausieren" title="Abspielen / Pausieren (Leertaste)">
      <svg class="p1" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="p2" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button id="stop" class="icon" title="Zum Anfang (Pos1)" aria-label="Zum Anfang">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5.5v13L9 12z"/></svg>
    </button>
    <div class="clock num"><b id="clk1">Takt 1 · 1</b><span id="clk2">0:00.0</span></div>
  </div>
  <canvas id="eq"></canvas>
  <div class="tr">
    <span class="hint" id="posHint">Elemente per Ziehen verschieben</span>
    <button id="reset" title="Verschobene Elemente zurücksetzen">Zurücksetzen</button>
    <button id="copy" title="Positionen in die Zwischenablage kopieren">Positionen kopieren</button>
    <span>Zoom</span><input id="zoom" type="range" min="0" max="100" value="0" aria-label="Zoom">
  </div>
</div>

<audio id="audio" src="song.m4a" preload="auto"></audio>
<script src="analysis.js"></script>
<script src="data.js"></script>
<script>
'use strict';
const SONG = window.SONG, ELEMENTS = window.ELEMENTS;
const NAMES = ['Flute', 'Trumpet', 'Frog', 'Building', 'Riser', 'Jagdhorn', 'Drums', 'Ringtone'];
const FIG_ROW_H = 40.75, RULER_H = 30, SB = 12, LS_KEY = 'blade-runner-av-positionen-v1';

const $ = id => document.getElementById(id);
const audio = $('audio'), scroll = $('scroll'), stage = $('stage'), daw = $('daw');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const peaks = new Int8Array(b64(SONG.peaks).buffer);
const spec = b64(SONG.spec.data), NB = SONG.spec.bands, SF = SONG.spec.fps, SFR = SONG.spec.frames;

const bpm = SONG.bpm, beats = SONG.beats, offset = SONG.offset, beatLen = 60 / bpm, barLen = beatLen * beats;
const audioDur = SONG.dur;
const nBars = Math.floor((audioDur - offset) / barLen);

let mode = 'bars', pps = 20, L = {}, selected = null, force = false;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch {}
const els = ELEMENTS.map(e => ({ ...e, t0: e.id in saved ? saved[e.id] : e.t0, orig: e.t0 }));
els.forEach(e => {                      // Breite eines Elements in Sekunden
  e.w = e.k === 'l' ? Math.max(...e.p.flatMap(p => p[1].map(q => q[0])))
      : e.k === 'f' ? Math.max(...e.p.flatMap(pl => pl.map(q => q[0])))
      : e.p[e.p.length - 1][0] + 0.15;
});
const TL = Math.max(audioDur, ...els.map(e => e.t0 + e.w)) + 0.4;   // Länge der Zeitachse

const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0'); };
const X = t => t * pps;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

$('facts').innerHTML =
  `<span class="fact"><b>${String(bpm).replace(/\.0$/, '')}</b> BPM</span><span class="fact"><b>${beats}/4</b></span>` +
  `<span class="fact"><b>${nBars}</b> Takte</span><span class="fact">${fmt(audioDur).replace(/\.\d$/, '')} min</span>`;

/* ---------- Layout ---------- */
function layout() {
  const H = daw.clientHeight - SB;
  const hero = Math.round((H - RULER_H) * 0.34), row = (H - RULER_H - hero) / 8;
  L = { H, hero, row, ky: row / FIG_ROW_H, bodyY: RULER_H + hero, bodyH: row * 8 };
  $('labels').innerHTML =
    `<div class="l ruler" style="height:${RULER_H}px">${mode === 'bars' ? 'Takt' : 'Zeit'}</div>` +
    `<div class="l hero" style="height:${hero}px">Audio<small>Spektrum · Welle</small></div>` +
    NAMES.map((n, i) => `<div class="l" style="height:${row}px;--c:var(--c${i})"><i></i>${n}</div>`).join('');
}

/* ---------- Lineal & Raster ---------- */
function gridParts() {
  let ruler = '', lines = '';
  const vline = (x, cls) => lines += `<line class="${cls}" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="0" y2="${L.hero + L.bodyH}"/>`;
  const tick = (x, y, major) => ruler += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y}" y2="${RULER_H}" stroke="var(${major ? '--line-2' : '--line'})"/>`;
  const label = (x, s) => ruler += `<text x="${(x + 5).toFixed(1)}" y="15" fill="var(--muted)" font-size="10.5" font-family="inherit">${s}</text>`;
  if (mode === 'time') {
    const major = [1, 2, 5, 10, 15, 30, 60].find(s => s * pps >= 64) || 60, minor = major >= 5 ? major / 5 : major / 2;
    for (let t = 0; t <= TL; t += minor) {
      const isM = Math.abs(t / major - Math.round(t / major)) < 1e-6, x = X(t);
      if (isM) { vline(x, 'gM'); tick(x, 8, true); label(x, `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, '0')}`); }
      else if (minor * pps >= 10) { vline(x, 'gm'); tick(x, 21, false); }
    }
  } else {
    const every = [1, 2, 4, 8, 16].find(n => barLen * n * pps >= 36) || 16;
    for (let i = 0; ; i++) {
      const t = offset + i * beatLen; if (t > TL) break;
      const x = X(t), isBar = i % beats === 0, bar = i / beats + 1;
      if (isBar && (bar - 1) % every === 0) { vline(x, 'gM'); tick(x, 8, true); label(x, bar); }
      else if (isBar) { vline(x, 'gm'); tick(x, 21, false); }
      else if (beatLen * pps >= 12) { vline(x, 'gb'); tick(x, 25, false); }
    }
  }
  return { ruler, lines };
}

/* ---------- Elemente (aus dem Figma-Bild nachgezeichnet) ---------- */
function smooth(pts, ky) {            // Kurven runden, scharfe Ecken bleiben scharf
  const P = pts.map(q => [X(q[0]), q[1] * ky]), f = q => q[0].toFixed(1) + ' ' + q[1].toFixed(1);
  if (P.length < 3) return 'M' + P.map(f).join('L');
  let d = 'M' + f(P[0]);
  for (let i = 1; i < P.length - 1; i++) {
    const a = P[i - 1], b = P[i], c = P[i + 1];
    const v1 = [b[0] - a[0], b[1] - a[1]], v2 = [c[0] - b[0], c[1] - b[1]];
    const cos = (v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2) || 1);
    d += cos < 0.55 ? 'L' + f(b) : 'Q' + f(b) + ' ' + f([(b[0] + c[0]) / 2, (b[1] + c[1]) / 2]);
  }
  return d + 'L' + f(P[P.length - 1]);
}

function elementSvg(e, i) {
  const ky = L.ky, c = `var(--c${e.row})`;
  let inner = '';
  if (e.k === 'l') {
    const byOp = {};
    for (const [op, pts] of e.p) (byOp[op] ||= []).push(smooth(pts, ky));
    for (const op in byOp) inner += `<path d="${byOp[op].join('')}" fill="none" stroke="${c}" stroke-opacity="${op}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  } else if (e.k === 'f') {
    const d = e.p.map(pl => 'M' + pl.map(q => X(q[0]).toFixed(1) + ' ' + (q[1] * ky).toFixed(1)).join('L') + 'Z').join('');
    if (e.g) {
      const stops = e.g.map((a, j) => `<stop offset="${j / (e.g.length - 1)}" stop-color="${c}" stop-opacity="${a}"/>`).join('');
      inner += `<defs><linearGradient id="gr${i}" gradientUnits="userSpaceOnUse" x1="0" x2="${X(e.w)}" y1="0" y2="0">${stops}</linearGradient></defs><path d="${d}" fill="url(#gr${i})"/>`;
    } else inner += `<path d="${d}" fill="${c}"/>`;
  } else if (e.k === 'd') {
    inner += e.p.map(q => `<circle cx="${(X(q[0]) + 3.6).toFixed(1)}" cy="${(q[1] * ky).toFixed(1)}" r="3.6" fill="${c}"/>`).join('');
  } else {
    inner += e.p.map(q => `<rect x="${(X(q[0]) - 2).toFixed(1)}" y="${(q[1] * ky - 2).toFixed(1)}" width="4" height="4" fill="${c}"/>`).join('');
  }
  const w = X(e.w) + 8;
  return `<g class="${e.w > 30 ? 'fixed' : 'el'}" data-i="${i}" style="--c:${c}" transform="translate(${X(e.t0).toFixed(1)} ${(e.row * L.row).toFixed(1)})">` +
    `<rect class="hit" x="-4" y="1" width="${w.toFixed(1)}" height="${(L.row - 2).toFixed(1)}" rx="5"/>${inner}</g>`;
}

/* ---------- Hero: Spektrogramm + Wellenform ---------- */
let specCanvas = null;
function lut() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const st = dark ? [[0, 14, 16, 30, 0], [.25, 40, 52, 150, .55], [.5, 118, 62, 230, .8], [.75, 255, 95, 140, .9], [1, 255, 214, 130, 1]]
                  : [[0, 240, 237, 229, 0], [.25, 190, 200, 255, .6], [.5, 150, 128, 255, .8], [.75, 255, 120, 150, .9], [1, 255, 176, 70, 1]];
  const out = new Uint8ClampedArray(256 * 4);
  for (let i = 0; i < 256; i++) {
    const v = i / 255; let a = st[0], b = st[st.length - 1];
    for (let j = 0; j < st.length - 1; j++) if (v >= st[j][0] && v <= st[j + 1][0]) { a = st[j]; b = st[j + 1]; break; }
    const u = (v - a[0]) / (b[0] - a[0] || 1);
    for (let k = 0; k < 3; k++) out[i * 4 + k] = a[k + 1] + (b[k + 1] - a[k + 1]) * u;
    out[i * 4 + 3] = (a[4] + (b[4] - a[4]) * u) * 255;
  }
  return out;
}
function buildSpec() {
  const c = document.createElement('canvas'); c.width = SFR; c.height = NB;
  const ctx = c.getContext('2d'), img = ctx.createImageData(SFR, NB), map = lut();
  for (let f = 0; f < SFR; f++) for (let b = 0; b < NB; b++) {
    const v = spec[f * NB + b], o = ((NB - 1 - b) * SFR + f) * 4;
    img.data[o] = map[v * 4]; img.data[o + 1] = map[v * 4 + 1]; img.data[o + 2] = map[v * 4 + 2]; img.data[o + 3] = map[v * 4 + 3];
  }
  ctx.putImageData(img, 0, 0); specCanvas = c;
}
function sizeCanvas(cv) {
  const W = Math.ceil(X(TL)), dpr = Math.min(devicePixelRatio || 1, 2), cw = Math.min(Math.round(W * dpr), 16000);
  cv.width = cw; cv.height = Math.round(L.hero * dpr); cv.style.width = W + 'px'; cv.style.height = L.hero + 'px';
  return { cw, dpr, W };
}
function envelope() {                  // Hüllkurve (mittlere Spitze je 24 ms), auf 0..1 normiert
  if (envelope.v) return envelope.v;
  const n = peaks.length / 2, win = 6, out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - win); j <= Math.min(n - 1, i + win); j++) { s += Math.max(Math.abs(peaks[2 * j]), peaks[2 * j + 1]); c++; }
    out[i] = s / c / 127;
  }
  const sorted = Float32Array.from(out).sort(), ref = sorted[Math.floor(n * .985)] || 1;
  for (let i = 0; i < n; i++) out[i] = Math.min(1, out[i] / ref);
  return envelope.v = out;
}
function drawWave(cv, color) {
  const { cw, dpr, W } = sizeCanvas(cv), c = cv.getContext('2d'); c.fillStyle = color;
  const env = envelope(), n = env.length, mid = cv.height / 2, amp = mid * .86, end = X(audioDur) * dpr * (cw / (W * dpr));
  const bw = 2 * dpr, step = 3 * dpr * (cw / (W * dpr));
  for (let px = 0; px < end; px += step) {
    const a = Math.floor(px / end * n), b = Math.max(a + 1, Math.floor((px + step) / end * n));
    let v = 0; for (let i = a; i < b && i < n; i++) v = Math.max(v, env[i]);
    const h = Math.max(1.5 * dpr, v ** 1.1 * amp);
    c.beginPath(); c.roundRect(px, mid - h, bw, h * 2, bw / 2); c.fill();
  }
  c.fillRect(end, mid - dpr / 2, cw - end, dpr);                 // flache Linie nach dem Audio-Ende
}
function drawHero() {
  const bg = $('bgc'), { cw } = sizeCanvas(bg), c = bg.getContext('2d');
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.globalAlpha = .55; c.drawImage(specCanvas, 0, 0, SFR, NB, 0, 0, Math.round(X(audioDur) / Math.ceil(X(TL)) * cw), bg.height);
  drawWave($('wv'), cssv('--wave'));
  drawWave($('wp'), cssv('--accent'));
}

/* ---------- Aufbau ---------- */
function render() {
  layout();
  const W = Math.ceil(X(TL)), { ruler, lines } = gridParts();
  stage.style.width = W + 'px'; stage.style.height = L.H + 'px';
  let seps = ''; for (let i = 1; i < 8; i++) seps += `<line class="rs" x1="0" x2="${W}" y1="${(i * L.row).toFixed(1)}" y2="${(i * L.row).toFixed(1)}"/>`;
  stage.innerHTML =
    `<svg id="ruler" width="${W}" height="${RULER_H}">${ruler}<line x1="0" x2="${W}" y1="${RULER_H - .5}" y2="${RULER_H - .5}" stroke="var(--line)"/></svg>` +
    `<div id="hero" style="top:${RULER_H}px;width:${W}px;height:${L.hero}px"><canvas id="bgc"></canvas><canvas id="wv"></canvas>` +
      `<div id="played"><canvas id="wp"></canvas></div></div>` +
    `<svg id="heroGrid" style="top:${RULER_H}px" width="${W}" height="${L.hero}">${lines.replace(/y2="[\d.]+"/g, `y2="${L.hero}"`)}</svg>` +
    `<svg id="body" style="top:${L.bodyY}px" width="${W}" height="${L.bodyH}"><g transform="translate(0 ${-L.hero})">${lines}</g>${seps}${els.map(elementSvg).join('')}</svg>` +
    `<div id="playhead"></div><div id="tip"></div>`;
  drawHero(); select(selected); tick(true);
}

/* ---------- Wiedergabe ---------- */
let lastToggle = 0;
function toggle() { const n = performance.now(); if (n - lastToggle < 200) return; lastToggle = n; audio.paused ? audio.play().catch(() => {}) : audio.pause(); }
function seek(t) { audio.currentTime = Math.min(Math.max(0, t), audioDur); tick(true); }

const eq = $('eq'), eqc = eq.getContext('2d'), EQN = 48, eqv = new Float32Array(EQN);
function drawEq(t) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = eq.clientWidth, h = eq.clientHeight;
  if (!w) return;
  if (eq.width !== Math.round(w * dpr)) { eq.width = Math.round(w * dpr); eq.height = Math.round(h * dpr); }
  eqc.setTransform(dpr, 0, 0, dpr, 0, 0); eqc.clearRect(0, 0, w, h);
  const f = Math.min(SFR - 1, Math.max(0, Math.round(t * SF))), gap = 3, bw = (w - gap * (EQN - 1)) / EQN;
  const col = cssv('--accent'), dim = cssv('--line-2');
  for (let i = 0; i < EQN; i++) {
    const b0 = Math.floor(i * NB / EQN), b1 = Math.max(b0 + 1, Math.floor((i + 1) * NB / EQN)); let v = 0;
    for (let b = b0; b < b1; b++) v = Math.max(v, spec[f * NB + b] / 255);
    eqv[i] = force ? v : Math.max(v, eqv[i] * .82);
    const bh = Math.max(2, eqv[i] ** 1.4 * h);
    eqc.fillStyle = eqv[i] > .05 ? col : dim; eqc.globalAlpha = .4 + .6 * eqv[i];
    eqc.beginPath(); eqc.roundRect(i * (bw + gap), h - bh, bw, bh, 1.5); eqc.fill();
  }
  eqc.globalAlpha = 1;
}
function tick(f) {
  force = f === true;
  const t = audio.currentTime, x = X(t), ph = $('playhead'); if (!ph) return;
  ph.style.left = x + 'px';
  const pl = $('played'); if (pl) pl.style.width = x + 'px';
  const rel = Math.max(0, t - offset), bi = Math.floor(rel / beatLen);
  const bars = `Takt ${Math.floor(bi / beats) + 1} · ${bi % beats + 1}`;
  $('clk1').textContent = mode === 'bars' ? bars : fmt(t);
  $('clk2').textContent = mode === 'bars' ? fmt(t) + ' s' : bars;
  drawEq(t);
  if (!audio.paused) { const vw = scroll.clientWidth; if (x > scroll.scrollLeft + vw * .88 || x < scroll.scrollLeft) scroll.scrollLeft = x - vw * .12; }
}
(function loop() { if (!audio.paused) tick(); requestAnimationFrame(loop); })();
audio.addEventListener('play', () => $('play').classList.add('on'));
audio.addEventListener('pause', () => { $('play').classList.remove('on'); tick(true); });
audio.addEventListener('ended', () => $('play').classList.remove('on'));
audio.addEventListener('seeked', () => tick(true));
$('play').onclick = toggle; $('stop').onclick = () => seek(0);

/* ---------- Interaktion: Position setzen & Elemente verschieben ---------- */
let drag = null;
const elNode = i => i == null ? null : stage.querySelector(`.el[data-i="${i}"]`);
function select(i) { elNode(selected)?.classList.remove('sel'); selected = i; elNode(selected)?.classList.add('sel'); }
function saveOverrides() {
  const o = {}; els.forEach(e => { if (Math.abs(e.t0 - e.orig) > 1e-4) o[e.id] = +e.t0.toFixed(3); });
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch {}
  const n = Object.keys(o).length;
  $('posHint').textContent = n ? `${n} Element${n > 1 ? 'e' : ''} verschoben` : 'Elemente per Ziehen verschieben';
}
function moveEl(i, t0) {
  const e = els[i]; e.t0 = Math.max(0, t0);
  elNode(i).setAttribute('transform', `translate(${X(e.t0).toFixed(1)} ${(e.row * L.row).toFixed(1)})`);
}
function showTip(i, clientX) {
  const e = els[i], tip = $('tip'), rel = e.t0 - offset;
  tip.style.display = 'block';
  tip.textContent = fmt(e.t0) + ' s' + (rel < 0 ? '' : ` · Takt ${(rel / barLen + 1).toFixed(2)}`);
  tip.style.left = clientX - stage.getBoundingClientRect().left + 'px'; tip.style.top = L.bodyY + e.row * L.row + 'px';
}
const seekFrom = ev => seek((ev.clientX - stage.getBoundingClientRect().left) / pps);
stage.addEventListener('pointerdown', ev => {
  const g = ev.target.closest('.el');
  stage.setPointerCapture(ev.pointerId);
  if (g) { const i = +g.dataset.i; select(i); g.classList.add('drag'); drag = { i, x: ev.clientX, t0: els[i].t0, moved: false }; }
  else { drag = { seek: true }; seekFrom(ev); select(null); }
});
stage.addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.seek) return seekFrom(ev);
  if (Math.abs(ev.clientX - drag.x) > 2) drag.moved = true;
  if (drag.moved) { const dt = (ev.clientX - drag.x) / pps; moveEl(drag.i, drag.t0 + (ev.altKey ? dt / 10 : dt)); showTip(drag.i, ev.clientX); }
});
const endDrag = () => { if (drag && !drag.seek) { elNode(drag.i)?.classList.remove('drag'); $('tip').style.display = 'none'; saveOverrides(); } drag = null; };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' && ev.code === 'Space') return;
  if (ev.target.tagName === 'BUTTON' && ev.code === 'Space') ev.preventDefault();
  if (ev.code === 'Space' || ev.code === 'MediaPlayPause') { ev.preventDefault(); toggle(); }
  else if (ev.altKey && selected != null && (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight')) {
    ev.preventDefault(); moveEl(selected, els[selected].t0 + (ev.code === 'ArrowLeft' ? -1 : 1) * (ev.shiftKey ? .1 : .01)); saveOverrides();
  }
  else if (ev.code === 'ArrowRight') seek(audio.currentTime + (ev.shiftKey ? 5 : 1));
  else if (ev.code === 'ArrowLeft') seek(audio.currentTime - (ev.shiftKey ? 5 : 1));
  else if (ev.code === 'Home') seek(0);
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({ title: 'Blade Runner 20', artist: 'Synthwave goose' });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
}
$('reset').onclick = () => { els.forEach(e => { e.t0 = e.orig; }); saveOverrides(); render(); };
$('copy').onclick = async () => {
  const o = {}; els.forEach(e => { o[e.id] = +e.t0.toFixed(3); });
  try { await navigator.clipboard.writeText(JSON.stringify(o, null, 1)); $('copy').textContent = 'Kopiert'; } catch { console.log(o); $('copy').textContent = 'Siehe Konsole'; }
  setTimeout(() => $('copy').textContent = 'Positionen kopieren', 1600);
};

/* ---------- Zoom / Modus / Theme ---------- */
const minPps = () => scroll.clientWidth / TL, maxPps = 220;
function setPps(v, ax) {
  const old = pps; pps = Math.min(maxPps, Math.max(minPps(), v));
  ax = ax ?? scroll.clientWidth / 2; const tA = (scroll.scrollLeft + ax) / old;
  render(); scroll.scrollLeft = tA * pps - ax;
  $('zoom').value = Math.round(Math.log(pps / minPps()) / Math.log(maxPps / minPps()) * 100);
}
const fit = () => { pps = minPps(); render(); $('zoom').value = 0; };
$('zoom').oninput = e => setPps(minPps() * Math.pow(maxPps / minPps(), e.target.value / 100));
scroll.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); setPps(pps * Math.exp(-e.deltaY * .0025), e.clientX - scroll.getBoundingClientRect().left); }, { passive: false });
let rz, lastH = 0, lastW = 0;
new ResizeObserver(() => { if (daw.clientHeight === lastH && scroll.clientWidth === lastW) return; clearTimeout(rz); rz = setTimeout(() => { lastH = daw.clientHeight; lastW = scroll.clientWidth; pps = Math.max(pps, minPps()); render(); }, 60); }).observe(daw);

function setMode(m) {
  mode = m; $('m-bars').classList.toggle('on', m === 'bars'); $('m-time').classList.toggle('on', m === 'time'); render();
  try { localStorage.setItem('av-mode', m); } catch {}
}
$('m-bars').onclick = () => setMode('bars'); $('m-time').onclick = () => setMode('time');
function setTheme(t) {
  document.documentElement.dataset.theme = t; try { localStorage.setItem('av-theme', t); } catch {}
  if (specCanvas) { buildSpec(); render(); }
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

{ let t, m; try { t = localStorage.getItem('av-theme'); m = localStorage.getItem('av-mode'); } catch {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (m === 'time') { mode = 'time'; $('m-bars').classList.remove('on'); $('m-time').classList.add('on'); } }
buildSpec(); fit(); saveOverrides();
</script>
</body>
