<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blade Runner 2049 – Audio-Visualisierung</title>
<style>
:root {
  --bg: #f4f2ed; --panel: #fbfaf7; --ink: #1b1b22; --muted: #7b7a82; --faint: #a9a8ae;
  --line: #e3e0d8; --line-2: #cfcbc0; --grid: #e9e6de; --accent: #ff6a14;
  --hero: #efece5;
  --c0: #12985f; --c1: #2558e8; --c2: #d8304c; --c3: #d98400; --c4: #e5158f; --c5: #7a4cff; --c6: #0c95ad; --c7: #7ea000;
  --wave: rgba(30,30,44,.78);
}
:root[data-theme="dark"] {
  --bg: #0b0c10; --panel: #11131a; --ink: #eeeef2; --muted: #8b8d99; --faint: #5d5f6b;
  --line: #1f222c; --line-2: #2d313e; --grid: #181b24; --accent: #ff8a2a;
  --hero: #0e1017;
  --c0: #3ddc97; --c1: #5ba3ff; --c2: #ff5f76; --c3: #ffb454; --c4: #ff3fa6; --c5: #b88cff; --c6: #46d9ee; --c7: #d6f45c;
  --wave: rgba(238,238,250,.8);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }

/* Kopfzeile */
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 4px; }
.title { display: flex; align-items: baseline; gap: 28px; min-width: 0; }
.title h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.title h1 span { color: var(--muted); font-weight: 450; }
.facts { display: flex; gap: 6px; flex-wrap: nowrap; }
.fact { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--panel); white-space: nowrap; }
.fact b { color: var(--ink); font-weight: 600; }
.right { display: flex; align-items: center; gap: 14px; }

button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 12px; cursor: pointer; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; height: 28px; background: transparent; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 34px 0 12px; cursor: pointer; appearance: none; -webkit-appearance: none; }
.sel { position: relative; display: inline-flex; margin-right: 10px; }
.sel::after { content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--muted); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); pointer-events: none; }
select:hover { border-color: var(--muted); }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-k { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; transition: border-color .15s; }
.btn-k:hover { border-color: var(--muted); }
.btn-k:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 1250px) { .btn-k .lbl { display: none; } .btn-k { width: 30px; padding: 0; justify-content: center; } }
.btn-k svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.icon { width: 30px; padding: 0; display: grid; place-items: center; }
.icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* DAW */
#daw { position: relative; display: flex; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
#labels { flex: 0 0 140px; border-right: 1px solid var(--line); background: var(--panel); position: relative; z-index: 3; }
#labels .l { display: flex; align-items: center; gap: 9px; white-space: nowrap; padding-left: 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 12.5px; }
#axis { position: absolute; width: 0; pointer-events: none; z-index: 2; }
#axis span { position: absolute; left: 6px; white-space: nowrap; transform: translateY(-50%); font-size: 10px; line-height: 1; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 2px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }
#body .tg { stroke: var(--line-2); stroke-dasharray: 2 4; }
#labels .l:has(.sub) { flex-wrap: wrap; align-content: center; row-gap: 3px; }
#labels .l .sub { flex-basis: 100%; padding-left: 19px; }
#labels .l .tv { font-variant-numeric: tabular-nums; font-weight: 650; }
#labels .l .info { width: 15px; height: 15px; margin-left: -3px; border: 1px solid var(--faint); border-radius: 50%; display: inline-grid; place-items: center; font: 600 9.5px/1 Georgia, serif; font-style: italic; color: var(--muted); cursor: help; flex: none; }
#labels .l .info:hover, #labels .l .info:focus-visible { color: var(--ink); border-color: var(--ink); outline: none; }
.curves #labels { flex-basis: 164px; }
#infoTip { position: fixed; z-index: 30; max-width: 270px; padding: 9px 11px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.25); pointer-events: none; }
#infoTip[hidden] { display: none; }
#labels .l .unit { color: var(--muted); font-weight: 450; font-size: 11px; }
#labels .l i { width: 3px; height: 14px; border-radius: 2px; background: var(--c); }
#labels .l .sw { width: 10px; height: 16px; padding: 0; border: 0; border-radius: 3px; background: var(--c); cursor: pointer; flex: none; transition: transform .12s, box-shadow .12s; }
#labels .l .sw:hover { transform: scale(1.15); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--line-2); }
#labels .l.hero { align-items: flex-start; padding-top: 11px; flex-direction: column; gap: 2px; }
#labels .l.hero small { color: var(--muted); font-weight: 450; font-size: 11px; }
#labels .l .up { margin-left: auto; margin-right: 8px; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; color: var(--faint); display: grid; place-items: center; border-radius: 6px; }
#labels .l .up:hover { color: var(--ink); background: var(--bg); }
#labels .l .up svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#labels .l.ruler { color: var(--faint); font-weight: 500; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; }
#scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
#stage { position: relative; user-select: none; touch-action: none; }
#ruler { position: absolute; left: 0; top: 0; cursor: pointer; }
#hero { position: absolute; left: 0; background: var(--hero); border-bottom: 1px solid var(--line); cursor: pointer; }
#hero canvas { position: absolute; left: 0; top: 0; }
#played { position: absolute; left: 0; top: 0; bottom: 0; overflow: hidden; width: 0; }
#body, #heroGrid { position: absolute; left: 0; }
#heroGrid { pointer-events: none; }
#body #mq { fill: color-mix(in srgb, var(--accent, #4c8dff) 14%, transparent); stroke: var(--accent, #4c8dff); stroke-dasharray: 3 3; pointer-events: none; }
#body .hd { fill: var(--bg, #fff); stroke: var(--accent, #4c8dff); stroke-width: 1.5; }
#body .hd[data-h=l], #body .hd[data-h=r] { cursor: ew-resize; }
#body .hd[data-h=t], #body .hd[data-h=b] { cursor: ns-resize; }
#body .hd[data-h=tl], #body .hd[data-h=br] { cursor: nwse-resize; }
#body .hd[data-h=tr], #body .hd[data-h=bl] { cursor: nesw-resize; }
#body .el { cursor: grab; }
#body .el.drag { cursor: grabbing; }
#daw.dropping { outline: 2px dashed var(--accent); outline-offset: -4px; }
#ctx { position: fixed; z-index: 20; min-width: 150px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
#ctx[hidden] { display: none; }
#ctx button { border: 0; width: 100%; text-align: left; height: 28px; display: flex; justify-content: space-between; align-items: center; background: transparent; }
#ctx button:hover { background: var(--bg); }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 8px); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#body .hit { fill: transparent; stroke: transparent; }
#body .el:hover .hit, #body .el.sel .hit { fill: color-mix(in srgb, var(--c) 9%, transparent); stroke: color-mix(in srgb, var(--c) 40%, transparent); stroke-dasharray: 3 3; }
.gM { stroke: var(--line-2); } .gm { stroke: var(--grid); } .gb { stroke: var(--grid); stroke-opacity: .55; } .rs { stroke: var(--line); }
#heroGrid .gM { opacity: .5; } #heroGrid .gm, #heroGrid .gb { stroke: var(--line-2); opacity: .2; }
#playhead { position: absolute; top: 0; width: 0; pointer-events: none; z-index: 4; }
#playhead::after { content: ""; position: absolute; top: 0; bottom: 0; left: -.75px; width: 1.5px; background: var(--accent); }
#playhead::before { content: ""; position: absolute; top: 0; left: -6px; border: 6px solid transparent; border-top: 9px solid var(--accent); border-bottom: 0; }
#phLine { fill: var(--accent); }
#tip { position: absolute; z-index: 5; pointer-events: none; font-size: 11px; background: var(--ink); color: var(--bg); padding: 2px 7px; border-radius: 6px; transform: translate(-50%, -125%); white-space: nowrap; display: none; }

/* Transport */
#transport { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 28px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.tl { display: flex; align-items: center; gap: 12px; }
#play { width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
#play:hover { background: var(--accent); }
#play svg { width: 18px; height: 18px; fill: currentColor; }
#play .p2 { display: none; } #play.on .p1 { display: none; } #play.on .p2 { display: block; }
.clock { display: flex; align-items: center; gap: 14px; }
.clock b { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; min-width: 120px; }
.clock span { color: var(--muted); font-size: 17px; min-width: 96px; }
#save { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; position: relative; }
#save:hover { background: var(--accent); border-color: var(--accent); }
#save.dirty::after { content: ""; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); }
.seekbar { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 11.5px; }
/* Spul-Regler bewusst dezent: dünne graue Linie, kleiner Griff, kein Orange */
#seek { flex: 1; width: auto; min-width: 100px; cursor: pointer; -webkit-appearance: none; appearance: none; height: 14px; background: transparent; --p: 0%; }
#seek::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: linear-gradient(to right, var(--muted) var(--p), var(--line-2) var(--p)); }
#seek::-moz-range-track { height: 2px; border-radius: 2px; background: var(--line-2); }
#seek::-moz-range-progress { height: 2px; border-radius: 2px; background: var(--muted); }
#seek::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; margin-top: -3px; border-radius: 50%; background: var(--muted); border: 0; transition: transform .15s; }
#seek::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); border: 0; }
#seek:hover::-webkit-slider-thumb, #seek:active::-webkit-slider-thumb { transform: scale(1.4); background: var(--ink); }
#seek:hover::-moz-range-thumb { background: var(--ink); }
#seek:focus-visible { outline-offset: 4px; }
.tr { justify-self: end; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
input[type=range] { width: 120px; accent-color: var(--accent); }
.hint { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
kbd { font: 10.5px ui-monospace, Consolas, monospace; color: var(--muted); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg); }
@media (max-width: 1100px) { .hint, .tr .zl { display: none; } #zoom { width: 80px; } #transport { gap: 18px; } }
@media (max-width: 1000px) { .fact:nth-child(n+3), .seekbar > span { display: none; } .clock b { font-size: 28px; min-width: 100px; } .clock span { min-width: 0; } }
</style>
</head>

}

const PH_W = 2;                          // Breite der Abspiel-Linie

    const W = X(e.w), H = L.row - 4, P = e.p.map(q => [q[0] * W, 2 + q[1] * H, q[2]]), f = q => q[0].toFixed(1) + ' ' + q[1].toFixed(1);

    const W = X(e.w), H = L.row - 4, r = Math.min(H * .15, W * .08), m = H * .1 + r * .3, f = v => v.toFixed(1);

    inner += `<ellipse cx="${(r / e.sx).toFixed(2)}" cy="${(2 + H / 2).toFixed(1)}" rx="${(r / e.sx).toFixed(2)}" ry="${(r / e.sy).toFixed(2)}" fill="${c}"/>`;
  } else if (e.k === 'r') {             // Rechtecke, relativ (0..1): [x, y, Breite, Höhe]

    inner += e.p.map(r => `<rect x="${(r[0] * W).toFixed(1)}" y="${(2 + r[1] * H).toFixed(1)}" width="${(r[2] * W).toFixed(1)}" height="${(r[3] * H).toFixed(1)}" fill="${c}"/>`).join('');

}

/* ---------- Variation 3: Spannungs- und Lautstärkekurve ---------- */
// Jede Kurve: Werte (10 pro Sekunde bzw. Stützpunkte), Abbildung auf 0..1, Skala, Live-Anzeige
const DB_LO = -26, DB_HI = -3;
const CURVE_DEF = [
  { frac: v => v / 10, ticks: [0, 2, 4, 6, 8, 10], tick: v => v, fmt: v => v.toFixed(1).replace('.', ',') },
  { frac: db => Math.min(1, Math.max(0, (db - DB_LO) / (DB_HI - DB_LO))), ticks: [-24, -18, -12, -6], tick: v => `${v} dB`, fmt: v => v.toFixed(1).replace('.', ',').replace('-', '−') },
  { frac: p => p / 100, ticks: [0, 25, 50, 75, 100], tick: v => `${v} %`, fmt: v => Math.round(v) },

const series = (k, t) => k === 0 ? null : (k === 1 ? LOUD : FULL)[Math.min(LOUD.length - 1, Math.max(0, Math.round(t * 10)))];
function tensionAt(t) {                 // Spannung an Sekunde t (linear zwischen den Punkten)
  const k = TENSION.findIndex(q => q[0] >= t);

  const [t0, v0] = TENSION[k - 1], [t1, v1] = TENSION[k];
  return v0 + (v1 - v0) * (t - t0) / (t1 - t0);
}
const curveAt = (r, t) => r === 0 ? tensionAt(t) : series(r, t);
const rowY = (r, frac) => r * L.row + L.row * .1 + (1 - frac) * L.row * .8;   // 10 % Rand oben und unten
function curvePts(r) {                  // Punkte [x, y] im Körper-SVG für Zeile r
  const d = CURVE_DEF[r];
  if (r === 0) return TENSION.map(([t, v]) => [X(t), rowY(0, d.frac(v))]);
  return (r === 1 ? LOUD : FULL).map((v, k) => [X(k / 10), rowY(r, d.frac(v))]);
}
function curveGrid(W) {                 // gestrichelte Hilfslinien auf Höhe der Skalenwerte
  if (!CURVES) return '';

  CURVE_DEF.forEach((d, r) => d.ticks.forEach(v => {
    if (d.frac(v) <= 0) return;
    const y = rowY(r, d.frac(v)).toFixed(1); g += `<line class="tg" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
  }));

}
function drawAxis() {                   // Skala am linken Rand, scrollt nicht mit
  const ax = $('axis');
  if (!CURVES) { ax.innerHTML = ''; return; }
  ax.style.left = $('labels').offsetWidth + 'px'; ax.style.top = L.bodyY + 'px';
  ax.innerHTML = CURVE_DEF.map((d, r) => d.ticks.map(v => `<span style="top:${rowY(r, d.frac(v)).toFixed(1)}px">${d.tick(v)}</span>`).join('')).join('');
}

    const P = curvePts(r), c = colorOf(r), base = (r + 1) * L.row, f = v => v.toFixed(1);
    const line = 'M' + P.map(q => f(q[0]) + ' ' + f(q[1])).join('L');
    out += `<path d="${line}L${f(P[P.length - 1][0])} ${f(base)}L${f(P[0][0])} ${f(base)}Z" fill="${c}" fill-opacity=".14"/>` +
      `<path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

}
/* ---------- Hero: Wellenform ---------- */
function sizeCanvas(cv) {
  const W = Math.ceil(X(TL)), dpr = Math.min(devicePixelRatio || 1, 2), cw = Math.min(Math.round(W * dpr), 16000);
  cv.width = cw; cv.height = Math.round(L.hero * dpr); cv.style.width = W + 'px'; cv.style.height = L.hero + 'px';
  return { cw, dpr, W };
}
function envelope() {                  // Hüllkurve (mittlere Spitze je 24 ms), auf 0..1 normiert
  if (envelope.v) return envelope.v;
  const n = peaks.length / 2, win = 6, out = new Float32Array(n);

/* ---------- Aufbau ---------- */

}

let lastToggle = 0;
function toggle() { const n = performance.now(); if (n - lastToggle < 200) return; lastToggle = n; audio.paused ? audio.play().catch(() => {}) : audio.pause(); }
function seek(t) { audio.currentTime = Math.min(Math.max(0, t), audioDur); tick(true); }

let seeking = false;
$('seek').max = audioDur; $('skEnd').textContent = fmt(audioDur).replace(/\.\d$/, '');
$('seek').addEventListener('input', e => { seeking = true; seek(+e.target.value); $('skNow').textContent = fmt(+e.target.value).replace(/\.\d$/, ''); });
$('seek').addEventListener('change', () => { seeking = false; });
let clock0 = null;                      // gleichmäßige Abspielzeit: audio.currentTime springt nur grob weiter
function playTime() {
  const ct = audio.currentTime; if (audio.paused) { clock0 = null; return ct; }
  const now = performance.now(), est = clock0 ? clock0.t + (now - clock0.p) / 1000 * audio.playbackRate : NaN;
  if (!(Math.abs(est - ct) < .06)) { clock0 = { t: ct, p: now }; return ct; }

}

  const t = playTime(), x = X(t), ph = $('playhead'); if (!ph) return;
  ph.style.left = x + 'px'; ph.style.height = L.bodyY + 'px';
  const px = (x - PH_W / 2).toFixed(1); $('phLine').setAttribute('x', px); $('phCut').setAttribute('x', px);
  const pl = $('played'); if (pl) pl.style.width = x + 'px';
  const rel = Math.max(0, t - offset), bi = Math.floor(rel / beatLen);
  const bars = `Takt ${Math.floor(bi / beats) + 1} · ${bi % beats + 1}`;
  $('clk1').textContent = fmt(t);
  $('clk2').textContent = bars;
  if (CURVES) CURVE_DEF.forEach((d, r) => { $('cv' + r).textContent = d.fmt(curveAt(r, t)); });
  if (!seeking) { $('seek').value = t; $('skNow').textContent = fmt(t).replace(/\.\d$/, ''); }
  $('seek').style.setProperty('--p', (t / audioDur * 100).toFixed(2) + '%');

let tt;

const idb = (mode, fn) => new Promise(res => {
  try {
    const r = indexedDB.open('av-store', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onerror = () => res(null);
    r.onsuccess = () => { const tx = r.result.transaction('h', mode), q = fn(tx.objectStore('h')); tx.oncomplete = () => res(q && q.result); tx.onerror = tx.onabort = () => res(null); };
  } catch { res(null); }
});

  let h = await idb('readonly', s => s.get('html'));
  if (h) { try { if (await h.queryPermission({ mode: 'readwrite' }) !== 'granted' && await h.requestPermission({ mode: 'readwrite' }) !== 'granted') h = null; } catch { h = null; } }
  if (!h) {
    h = (await showOpenFilePicker({ types: [{ description: 'index.html', accept: { 'text/html': ['.html'] } }] }))[0];
    if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') throw new Error('keine Schreibrechte');
    idb('readwrite', s => s.put(h, 'html'));
  }

}
const STATE_RE = /<script id="state-data">[\s\S]*?<\/script>/;
async function save() {
  const snap = snapshot(), stamp = Date.now();

  const block = txt => {                 // nur die aktive Variante ersetzen, die anderen aus der Datei übernehmen
    let all = ALL;
    try { all = JSON.parse(txt.match(STATE_RE)[0].replace(/^<script id="state-data">window\.STATE=/, '').replace(/;?<\/script>$/, '')); } catch {}
    const variants = { ...all.variants };
    if (VARIANT) variants[VARIANT] = own;
    const { variants: _, ...orig } = VARIANT ? all : own;
    return '<script id="state-data">window.STATE=' + JSON.stringify({ ...orig, variants }).replace(/</g, '\\u003c') + ';<\/script>';
  };
  try {
    if (window.showOpenFilePicker) {
      const h = await fileHandle(), txt = await (await h.getFile()).text();
      if (!STATE_RE.test(txt)) throw new Error('Das ist nicht die index.html dieses Projekts');
      const w = await h.createWritable(); await w.write(txt.replace(STATE_RE, () => block(txt))); await w.close();
      toast('In index.html gespeichert – jetzt committen & pushen');
    } else {
      const txt = await (await fetch(location.href.split('#')[0], { cache: 'no-store' })).text();
      const a = document.createElement('a'); a.download = 'index.html';
      a.href = URL.createObjectURL(new Blob([txt.replace(STATE_RE, () => block(txt))], { type: 'text/html' })); a.click();
      toast('index.html heruntergeladen – im Projektordner ersetzen');
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    const a = document.createElement('a'); a.download = 'zustand-backup.json';       // Notfall: Zustand als Datei sichern
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ variant: VARIANT || 'original', ...own })], { type: 'application/json' })); a.click();
    toast('index.html nicht lesbar (' + err.message + ') – Änderungen als zustand-backup.json gesichert, bitte an Claude geben', 8000);
    return;
  }

}

  if (!src.startsWith('data:image/svg')) {
    const k = Math.min(1, 320 / h, 3000 / w);
    if (k < 1) { const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); src = c.toDataURL('image/png'); }
  }
  return { src, ar: w / h };
}
const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
async function addImages(srcs, row, t) {
  let n = 0;
  for (const raw of srcs) {
    try {
      const { src, ar } = await prepImage(raw), w = Math.max(.2, ar * (L.row - 4) / pps);
      const at = Math.max(0, Math.min(t, TL - w));
      els.push({ id: newId(), custom: true, k: 'i', row, t0: at, orig: at, origRow: row, w, sx: 1, sy: 1, src, del: false });
      selected = els.length - 1; multi = new Set([selected]); t = at + w + .1; n++;
    } catch { toast('Bild konnte nicht gelesen werden'); }
  }
  if (n) { render(); saveLocal(); toast(n + (n > 1 ? ' Bilder' : ' Bild') + ' eingefügt – ziehen zum Verschieben, Entf zum Löschen'); }
}
const svgUrl = txt => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(txt)));
const rowAt = y => { const r = Math.floor((y - stage.getBoundingClientRect().top - L.bodyY) / L.row); return r < 0 || r >= NAMES.length ? null : r; };
const target = () => ({ row: hover?.row ?? (selected != null ? els[selected].row : 0), t: hover?.t ?? audio.currentTime });

document.addEventListener('paste', async ev => {
  if (ev.target.tagName === 'INPUT') return;
  const cd = ev.clipboardData; let srcs = [];
  const files = [...cd.files].filter(f => f.type.startsWith('image/'));
  if (files.length) srcs = await Promise.all(files.map(readFile));
  else {
    const txt = cd.getData('text/plain').trim(), html = cd.getData('text/html');
    const img = html.match(/<img[^>]+src="(data:image[^"]+)"/i), svg = html.match(/<svg[\s\S]*<\/svg>/i);
    if (/^<svg[\s>]/i.test(txt)) srcs = [svgUrl(txt)];
    else if (img) srcs = [img[1]];
    else if (svg) srcs = [svgUrl(svg[0])];
  }
  if (!srcs.length && clip) { ev.preventDefault(); pasteClip(); return; }
  if (!srcs.length) { if (/figma/i.test(cd.getData('text/html'))) { ev.preventDefault(); toast('Figma kopiert hier kein Bild – bitte „Als PNG kopieren“ (Strg+Umschalt+C) verwenden'); } return; }
  ev.preventDefault();
  const { row, t } = target(); addImages(srcs, row, t);
});
daw.addEventListener('dragover', ev => { if (ev.dataTransfer.types.includes('Files')) { ev.preventDefault(); daw.classList.add('dropping'); } });
daw.addEventListener('dragleave', ev => { if (!daw.contains(ev.relatedTarget)) daw.classList.remove('dropping'); });
daw.addEventListener('drop', async ev => {
  ev.preventDefault(); daw.classList.remove('dropping');
  const files = [...ev.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!files.length) return toast('Nur Bilder (PNG, SVG, JPG …) können abgelegt werden');
  const row = rowAt(ev.clientY) ?? 0, t = Math.max(0, (ev.clientX - stage.getBoundingClientRect().left) / pps);
  addImages(await Promise.all(files.map(readFile)), row, t);
});
// Info-Kasten für das „i“ (fest positioniert, damit er nicht abgeschnitten wird)
function showInfo(el) {
  const tip = $('infoTip'), r = el.getBoundingClientRect();
  tip.textContent = INFOS[+el.dataset.row]; tip.hidden = false;
  const h = tip.offsetHeight;
  tip.style.left = r.right + 10 + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, r.top + r.height / 2 - h / 2)) + 'px';
}
const hideInfo = () => { $('infoTip').hidden = true; };
$('labels').addEventListener('mouseover', ev => { const i = ev.target.closest('.info'); if (i) showInfo(i); });
$('labels').addEventListener('mouseout', ev => { if (ev.target.closest('.info')) hideInfo(); });
$('labels').addEventListener('focusin', ev => { const i = ev.target.closest('.info'); if (i) showInfo(i); });
$('labels').addEventListener('focusout', hideInfo);
let fileRow = 0, pickRow = 0;
const toHex = c => { const x = document.createElement('canvas').getContext('2d'); x.fillStyle = c; return x.fillStyle; };
$('labels').addEventListener('click', ev => {
  const b = ev.target.closest('.sw'); if (!b) return;
  pickRow = +b.dataset.row; const r = b.getBoundingClientRect(), pk = $('pick');
  pk.style.left = r.left + 'px'; pk.style.top = r.bottom + 'px';
  const cur = colors[pickRow] || `var(--c${pickRow})`, v = cur.match(/^var\((--[\w-]+)\)$/);
  pk.value = toHex(v ? cssv(v[1]) : cur); pk.click();
});
$('pick').oninput = ev => { colors[pickRow] = ev.target.value; render(); };
$('pick').onchange = () => saveLocal();
$('labels').addEventListener('click', ev => { const b = ev.target.closest('.up'); if (!b) return; fileRow = +b.dataset.row; $('file').click(); });
$('file').onchange = async ev => {
  const files = [...ev.target.files]; ev.target.value = '';
  if (files.length) addImages(await Promise.all(files.map(readFile)), fileRow, audio.currentTime);
};

/* ---------- Interaktion: Position setzen, Elemente verschieben & löschen ---------- */
let drag = null;
const elNode = i => i == null ? null : stage.querySelector(`.el[data-i="${i}"]`);
let multi = new Set();
const sels = () => [...multi].filter(i => els[i] && !els[i].del).sort((a, b) => a - b);
function select(i, add) {
  if (add && i != null) { multi.has(i) ? multi.delete(i) : multi.add(i); i = multi.has(i) ? i : (sels().pop() ?? null); }
  else multi = new Set(i == null ? [] : [i]);
  selected = i; syncSel();
}
function syncSel() {
  stage.querySelectorAll('.el.sel').forEach(n => n.classList.remove('sel'));
  for (const i of sels()) elNode(i)?.classList.add('sel');
  drawHandles();
}
function drawHandles() {
  const h = $('hdl'); if (!h) return;
  if (selected == null || els[selected]?.del || sels().length !== 1) { h.innerHTML = ''; return; }
  const e = els[selected], cy = (e.row + .5) * L.row, hh = (L.row - 2) * e.sy / 2, x0 = X(e.t0) - 4 * e.sx, x1 = X(e.t0) + (X(e.w) + 4) * e.sx, xm = (x0 + x1) / 2;
  const pts = { tl: [x0, cy - hh], t: [xm, cy - hh], tr: [x1, cy - hh], l: [x0, cy], r: [x1, cy], bl: [x0, cy + hh], b: [xm, cy + hh], br: [x1, cy + hh] };
  h.innerHTML = Object.entries(pts).map(([k, p]) => `<rect class="hd" data-h="${k}" x="${(p[0] - 4).toFixed(1)}" y="${(p[1] - 4).toFixed(1)}" width="8" height="8" rx="2"/>`).join('');
}
let clip = null;
const endOf = list => Math.max(...list.map(e => e.t0 + ew(e)));
function copySel() {
  const l = sels(); if (!l.length) return false;
  clip = l.map(i => { const { orig, origRow, del, ...c } = els[i]; return c; }); return true;
}
function pasteClip() {                  // direkt hinter das (letzte) markierte Element
  const cur = sels().map(i => els[i]), from = Math.min(...clip.map(c => c.t0));
  let start = endOf(cur.length ? cur : clip) + .05;
  const span = endOf(clip) - from; start = Math.max(0, Math.min(start, TL - span));
  const ids = clip.map(c => { const n = { ...c, id: newId(), custom: true, t0: start + c.t0 - from, del: false }; n.orig = n.t0; n.origRow = n.row; els.push(n); return els.length - 1; });
  multi = new Set(ids); selected = ids[ids.length - 1]; render(); saveLocal();
}
function placeEl(i) { const t = elT(els[i]); elNode(i).setAttribute('transform', t); $('u' + i)?.setAttribute('transform', t); }
function moveEl(i, t0, row) {
  const e = els[i]; e.t0 = Math.min(Math.max(0, t0), Math.max(0, TL - ew(e))); if (row != null) e.row = row;
  placeEl(i); drawHandles();
}
function delSelected() { const l = sels(); if (!l.length) return; l.forEach(i => els[i].del = true); multi = new Set(); selected = null; render(); saveLocal(); }
function showTip(i, clientX) {
  const e = els[i], tip = $('tip'), rel = e.t0 - offset;
  tip.style.display = 'block';
  tip.textContent = fmt(e.t0) + ' s' + (rel < 0 ? '' : ` · Takt ${(rel / barLen + 1).toFixed(2)}`);
  tip.style.left = clientX - stage.getBoundingClientRect().left + 'px'; tip.style.top = L.bodyY + e.row * L.row + 'px';
}
const seekFrom = ev => seek((ev.clientX - stage.getBoundingClientRect().left) / pps);
stage.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  const g = ev.target.closest('.el'), hd = ev.target.closest('.hd');
  stage.setPointerCapture(ev.pointerId);
  if (hd && selected != null) { const e = els[selected]; drag = { rs: hd.dataset.h, i: selected, x: ev.clientX, y: ev.clientY, t0: e.t0, sx: e.sx, sy: e.sy }; }
  else if (g) {
    const i = +g.dataset.i, add = ev.shiftKey || ev.ctrlKey || ev.metaKey;
    if (add) select(i, true); else if (!multi.has(i)) select(i); else selected = i;
    if (!multi.has(i)) { drag = { seek: true }; return; }
    const ids = sels(); ids.forEach(j => elNode(j)?.classList.add('drag'));
    drag = { i, x: ev.clientX, row: els[i].row, items: ids.map(j => ({ j, t0: els[j].t0, row: els[j].row })), moved: false };
  }
  else if (ev.shiftKey) { const b = stage.getBoundingClientRect(); drag = { mq: true, x: ev.clientX - b.left, y: ev.clientY - b.top - L.bodyY, base: new Set(multi) }; }
  else { drag = { seek: true }; seekFrom(ev); select(null); }
});
stage.addEventListener('pointermove', ev => {
  const r = rowAt(ev.clientY);
  hover = r == null ? null : { row: r, t: (ev.clientX - stage.getBoundingClientRect().left) / pps };
  if (!drag) return;
  if (drag.seek) return seekFrom(ev);
  if (drag.rs) return resizeEl(ev);
  if (drag.mq) return marquee(ev);
  if (Math.abs(ev.clientX - drag.x) > 2 || (r != null && r !== drag.row)) drag.moved = true;
  if (drag.moved) {
    const dt = (ev.clientX - drag.x) / pps, d = ev.altKey ? dt / 10 : dt, dr = r == null ? 0 : r - drag.row;
    const minT = Math.min(...drag.items.map(m => m.t0)), maxE = Math.max(...drag.items.map(m => m.t0 + ew(els[m.j])));
    const dd = Math.min(Math.max(d, -minT), Math.max(0, TL - maxE));
    const minR = Math.min(...drag.items.map(m => m.row)), maxR = Math.max(...drag.items.map(m => m.row));
    const drr = Math.min(Math.max(dr, -minR), 7 - maxR);
    for (const m of drag.items) moveEl(m.j, m.t0 + dd, m.row + drr);
    showTip(drag.i, ev.clientX);
  }
});
stage.addEventListener('pointerleave', () => { hover = null; });
function marquee(ev) {
  const b = stage.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top - L.bodyY, d = drag;
  const x0 = Math.min(x, d.x), x1 = Math.max(x, d.x), y0 = Math.min(y, d.y), y1 = Math.max(y, d.y);
  const q = $('mq'); q.setAttribute('display', 'inline'); q.setAttribute('x', x0); q.setAttribute('y', y0); q.setAttribute('width', x1 - x0); q.setAttribute('height', y1 - y0);
  multi = new Set(d.base);
  els.forEach((e, i) => { if (!e.del && X(e.t0 + ew(e)) >= x0 && X(e.t0) <= x1 && (e.row + 1) * L.row >= y0 && e.row * L.row <= y1) multi.add(i); });
  selected = sels().pop() ?? null; syncSel();
}
function resizeEl(ev) {
  const d = drag, e = els[d.i], k = d.rs, dx = (ev.clientX - d.x) / pps, dyPx = ev.clientY - d.y;
  const w0 = e.w * d.sx, half0 = (L.row - 2) / 2 * d.sy;
  let sx = d.sx, sy = d.sy, t0 = d.t0;
  const newW = k.includes('r') ? w0 + dx : k.includes('l') ? w0 - dx : w0;
  const newH = k.includes('b') ? half0 + dyPx : k.includes('t') ? half0 - dyPx : half0;
  const rx = Math.max(.02, newW / w0), ry = Math.max(.05, newH / half0);
  if (k.length === 2) { const f = (rx + ry) / 2; sx = d.sx * f; sy = d.sy * f; if (k.includes('l')) t0 = d.t0 + w0 - e.w * sx; }
  else if (k === 'r' || k === 'l') { sx = d.sx * rx; if (k === 'l') t0 = d.t0 + w0 - e.w * sx; }
  else sy = d.sy * ry;
  sx = Math.min(Math.max(sx, .01), 40); sy = Math.min(Math.max(sy, .08), 1);
  if (k.includes('l')) t0 = d.t0 + w0 - e.w * sx;
  e.sx = sx; e.sy = sy; e.t0 = Math.max(0, t0);
  placeEl(d.i); drawHandles();
}
const endDrag = () => {
  if (drag?.rs || drag?.mq) saveLocal();
  if (drag?.mq) $('mq')?.setAttribute('display', 'none');
  if (drag && drag.items) { stage.querySelectorAll('.el.drag').forEach(n => n.classList.remove('drag')); $('tip').style.display = 'none'; saveLocal(); }
  drag = null;
};
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

const ctx = $('ctx');
stage.addEventListener('contextmenu', ev => {
  const g = ev.target.closest('.el'); if (!g) return;
  ev.preventDefault(); if (!multi.has(+g.dataset.i)) select(+g.dataset.i);
  ctx.hidden = false; ctx.style.left = Math.min(ev.clientX, innerWidth - 170) + 'px'; ctx.style.top = Math.min(ev.clientY, innerHeight - 44) + 'px';
});
document.addEventListener('pointerdown', ev => { if (!ev.target.closest('#ctx')) ctx.hidden = true; }, true);
$('ctxDel').onclick = () => { ctx.hidden = true; delSelected(); };

document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.code === 'KeyS') { ev.preventDefault(); save(); return; }
  if (ev.code === 'Escape') ctx.hidden = true;
  if ((ev.ctrlKey || ev.metaKey) && ev.code === 'KeyC' && ev.target.tagName !== 'INPUT' && copySel()) { toast(sels().length + ' Element(e) kopiert – Strg+V fügt sie direkt dahinter ein'); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.code === 'KeyA' && ev.target.tagName !== 'INPUT') { ev.preventDefault(); multi = new Set(els.keys()); selected = sels().pop() ?? null; syncSel(); return; }
  if (ev.target.tagName === 'INPUT' && ev.code === 'Space') return;
  if (ev.target.tagName === 'BUTTON' && ev.code === 'Space') ev.preventDefault();
  if (ev.code === 'Space' || ev.code === 'MediaPlayPause') { ev.preventDefault(); toggle(); }
  else if ((ev.code === 'Delete' || ev.code === 'Backspace') && selected != null && ev.target.tagName !== 'INPUT') { ev.preventDefault(); delSelected(); }
  else if (ev.altKey && selected != null && (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight')) {
    ev.preventDefault(); sels().forEach(j => moveEl(j, els[j].t0 + (ev.code === 'ArrowLeft' ? -1 : 1) * (ev.shiftKey ? .1 : .01))); saveLocal();
  }
  else if (ev.code === 'ArrowRight') seek(audio.currentTime + (ev.shiftKey ? 5 : 1));
  else if (ev.code === 'ArrowLeft') seek(audio.currentTime - (ev.shiftKey ? 5 : 1));
  else if (ev.code === 'Home') seek(0);
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({ title: 'Blade Runner 2049', artist: 'Synthwave goose' });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
}

/* ---------- Zoom / Modus / Theme ---------- */
const minPps = () => scroll.clientWidth / TL, maxPps = 220;
function setPps(v, ax) {
  const old = pps; pps = Math.min(maxPps, Math.max(minPps(), v));
  ax = ax ?? scroll.clientWidth / 2; const tA = (scroll.scrollLeft + ax) / old;
  render(); scroll.scrollLeft = tA * pps - ax;
  $('zoom').value = Math.round(Math.log(pps / minPps()) / Math.log(maxPps / minPps()) * 100);
}
const fit = () => { pps = minPps(); render(); $('zoom').value = 0; };
$('zoom').oninput = e => setPps(minPps() * Math.pow(maxPps / minPps(), e.target.value / 100));
scroll.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); setPps(pps * Math.exp(-e.deltaY * .0025), e.clientX - scroll.getBoundingClientRect().left); }, { passive: false });
let rz, lastH = 0, lastW = 0;
new ResizeObserver(() => { if (daw.clientHeight === lastH && scroll.clientWidth === lastW) return; clearTimeout(rz); rz = setTimeout(() => { lastH = daw.clientHeight; lastW = scroll.clientWidth; pps = Math.max(pps, minPps()); render(); }, 60); }).observe(daw);

function setMode(m) {
  mode = m; $('m-bars').classList.toggle('on', m === 'bars'); $('m-time').classList.toggle('on', m === 'time'); render();
  try { localStorage.setItem('av-mode', m); } catch {}
}
$('m-bars').onclick = () => setMode('bars'); $('m-time').onclick = () => setMode('time');
function setTheme(t) {
  document.documentElement.dataset.theme = t; try { localStorage.setItem('av-theme', t); } catch {}
  render();
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

document.documentElement.dataset.theme = 'dark';   // Variationen starten immer dunkel und in Takten
setPps(scroll.clientWidth / (offset + 20 * barLen), 0); scroll.scrollLeft = 0; updateDirty();   // Start: Takt 1–20 im Blick
</script>
