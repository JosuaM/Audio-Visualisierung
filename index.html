<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthwave Goose – Blade Runner 20 | Audio-Visualisierung</title>
<style>
:root {
  --bg: #f3f3ef; --panel: #ffffff; --ink: #121212; --muted: #6f6f69;
  --line: #d9d9d3; --line-strong: #8d8d86; --grid-minor: #ececE6;
  --playhead: #ff6a00; --wave: #3b3b38; --wave-bg: #fafaf7;
  --flute: #17994a; --trumpet: #1d22d8; --frog: #d11a1a; --riser: #ff0f8f;
  --m-red: #ff4d4d; --m-magenta: #e74fd8; --m-cyan: #3ee0ee;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
}
:root[data-theme="dark"] {
  --bg: #0c0d11; --panel: #15171d; --ink: #f1f1ee; --muted: #8d909a;
  --line: #2a2d37; --line-strong: #4b4f5c; --grid-minor: #1d2028;
  --playhead: #ff8a1f; --wave: #9aa3ff; --wave-bg: #11131a;
  --flute: #3fe086; --trumpet: #6f7bff; --frog: #ff5f5f; --riser: #ff3fa8;
  --m-red: #ff5f5f; --m-magenta: #f06be2; --m-cyan: #3ee0ee;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; padding: 20px 24px; gap: 16px;
  transition: background .2s, color .2s;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.controls { padding: 10px 14px; justify-content: space-between; }
button, select, input {
  font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 6px 11px; height: 34px;
}
button { cursor: pointer; }
button:hover { border-color: var(--line-strong); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--playhead); outline-offset: 1px; }
#play {
  width: 46px; height: 46px; border-radius: 50%; padding: 0; border: 0;
  background: var(--playhead); color: #fff; display: grid; place-items: center;
}
#play svg { width: 20px; height: 20px; fill: currentColor; }
#play .i-pause { display: none; }
#play.on .i-play { display: none; } #play.on .i-pause { display: block; }
#stop { width: 34px; padding: 0; display: grid; place-items: center; }
.clock { font-variant-numeric: tabular-nums; min-width: 150px; }
.clock b { font-size: 22px; font-weight: 650; display: block; line-height: 1.1; }
.clock span { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button.on { background: var(--ink); color: var(--panel); }
label.f { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
label.f input { width: 62px; text-align: right; }
input[type=range] { width: 110px; padding: 0; accent-color: var(--playhead); }
.hide { display: none !important; }

#daw { display: flex; overflow: hidden; flex: 0 0 auto; }
#labels { flex: 0 0 112px; border-right: 1px solid var(--line); background: var(--panel); z-index: 3; }
#labels div { display: flex; align-items: center; padding-left: 14px; font-weight: 650; border-bottom: 1px solid var(--line); }
#labels .sp { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
#scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
#stage { position: relative; }
#ruler { display: block; cursor: pointer; }
#wavewrap { position: absolute; left: 0; background: var(--wave-bg); }
#wave { display: block; height: 100%; }
#body { position: absolute; left: 0; pointer-events: none; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--playhead); pointer-events: none; z-index: 2; box-shadow: 0 0 8px var(--playhead); }
#playhead::before { content: ""; position: absolute; top: 0; left: -6px; border: 7px solid transparent; border-top: 11px solid var(--playhead); border-bottom: 0; }
#shade { position: absolute; top: 0; bottom: 0; left: 0; background: var(--playhead); opacity: .06; pointer-events: none; }
#wavemsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; z-index: 1; }
#wavemsg button { margin-left: 8px; height: 28px; }
.hint { color: var(--muted); font-size: 12px; }
kbd { background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font: 11px ui-monospace, monospace; }

/* Visuals */
svg .t { fill: var(--muted); font: 11px system-ui, sans-serif; }
svg .gm { stroke: var(--line); stroke-width: 1; }
svg .gM { stroke: var(--line-strong); stroke-width: 1; }
svg .gn { stroke: var(--grid-minor); stroke-width: 1; }
svg .rowsep { stroke: var(--line); stroke-width: 1; }
svg .flute { fill: none; stroke: var(--flute); stroke-width: 1.6; }
svg .trumpet { fill: none; stroke: var(--trumpet); stroke-width: 1.6; stroke-linejoin: round; }
svg .frog { fill: none; stroke: var(--frog); stroke-width: 1.8; stroke-linejoin: round; }
svg .bld { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
svg .bld.g { stroke: var(--line-strong); opacity: .75; }
svg .riser { fill: var(--riser); }
svg .ink { fill: var(--ink); }
</style>
</head>
<body>

<header>
  <h1><small>Audio-Visualisierung</small>Synthwave goose – Blade Runner 20</h1>
  <div class="bar hint">
    <span><kbd>Leertaste</kbd> / <kbd>⏯</kbd> Play·Pause</span>
    <span><kbd>←</kbd><kbd>→</kbd> Spulen</span>
    <span><kbd>Strg</kbd>+Mausrad Zoom</span>
  </div>
</header>

<div class="card bar controls">
  <div class="bar">
    <button id="play" aria-label="Abspielen / Pausieren" title="Abspielen / Pausieren (Leertaste)">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button id="stop" aria-label="Zum Anfang" title="Zum Anfang (Pos1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h3v16H5zM21 4v16L9 12z"/></svg>
    </button>
    <div class="clock"><b id="clk1">Takt 1 · 1</b><span id="clk2">0:00.0</span></div>
  </div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Anzeige">
      <button id="m-bars" class="on">Takte</button>
      <button id="m-time">Zeit</button>
    </div>
    <span id="barset" class="bar">
      <label class="f">BPM <input id="bpm" type="number" min="30" max="300" step="0.5" value="120"></label>
      <label class="f">Takt <select id="beats"><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select></label>
      <label class="f">Start&nbsp;(s) <input id="off" type="number" step="0.01" value="0"></label>
    </span>
    <label class="f">Zoom <input id="zoom" type="range" min="0" max="100" value="0"></label>
    <button id="theme" title="Dark / Light">◐</button>
  </div>
</div>

<div id="daw" class="card">
  <div id="labels"></div>
  <div id="scroll"><div id="stage"></div></div>
</div>

<audio id="audio" src="song.m4a" preload="auto"></audio>
<input id="file" type="file" accept="audio/*" class="hide">

<script>
'use strict';
/* ====================================================================
   DATEN – exakt aus dem Figma-Bild übernommen.
   Alle Positionen stehen als Pixel-x des Figma-Bildes (0:00 = x 70, 20.14 px je Sekunde)
   und werden unten in Sekunden umgerechnet. Zum Feinjustieren einfach die Zahlen ändern.
   ==================================================================== */
const FIG_X0 = 70, FIG_PPS = 20.14;
const sec = x => (x - FIG_X0) / FIG_PPS;

const ROW_H = 40, WAVE_H = 96, RULER_H = 30;
const FIG_ROW_TOP = [12, 49, 85, 121, 157, 193, 229, 266];   // Figma-y der Zeilen
const K = ROW_H / 36.3;
const ly = (row, y) => (y - FIG_ROW_TOP[row]) * K;             // Figma-y -> Zeilen-y

const TRACKS = ['Flute', 'Trumpet', 'Frog', 'Building', 'Riser', 'Jagdhorn', 'Drums', 'Ringtone'];

const D = {
  fluteStart: sec(70), fluteEnd: sec(1392),                    // 1 Bogen pro Sekunde
  trumpet: [[403,437],[453,472],[475,507],[575,597],[625,647],[650,672],[697,740],[787,808],[810,830],[857,895],[907,940],[957,990],[1030,1068]],
  frog: [[403,450],[452,522],[524,572],[575,622],[625,672],[675,695],[697,745],[747,795],[797,812],[814,860],[862,910],[912,960],[962,1010],[1012,1035],[1037,1085]],
  buildingGrey: [829, 875],
  building: [[877,920],[922,970],[972,1017],[1019,1063]],
  riser: [997, 1035, 1062],
  jagd: [1043, 1080],
  drums: { start: sec(1040), step: 0.5, n: 44 },
  ring: { start: sec(1040), step: 0.25, n: 88,
          pat: [3,1,2,0,3,1,2,-1, 3,1,2,0,4,2,1,-1] },
  // Marker (Figma-x, bis wo die Linie nach unten läuft [Figma-y], Farbe)
  markers: [[403,108,'red'],[856,120,'magenta'],[1037,120,'magenta'],[1077,120,'magenta'],[1088,115,'red']],
};

/* ====================================================================
   Zustand
   ==================================================================== */
const $ = id => document.getElementById(id);
const audio = $('audio'), scroll = $('scroll'), stage = $('stage');
let duration = 72.1, pps = 20.14, mode = 'bars', peaks = null;
let bpm = 120, beats = 4, offset = 0;
let lastToggle = 0;

const fmtTime = t => { t = Math.max(0, t); const m = Math.floor(t / 60); return m + ':' + (t % 60).toFixed(1).padStart(4, '0'); };
const X = t => t * pps;
const fx = x => X(sec(x));

/* ====================================================================
   Aufbau
   ==================================================================== */
function buildLabels() {
  $('labels').innerHTML =
    `<div class="sp" style="height:${RULER_H}px">Spur</div>` +
    `<div style="height:${WAVE_H}px">Audio</div>` +
    TRACKS.map(n => `<div style="height:${ROW_H}px">${n}</div>`).join('');
}

function gridSvg(W) {
  const out = []; const H = WAVE_H + ROW_H * TRACKS.length;
  let tick = '';
  const line = (x, cls) => `<line class="${cls}" x1="${x.toFixed(2)}" x2="${x.toFixed(2)}" y1="0" y2="${H}"/>`;
  let rul = '';
  if (mode === 'time') {
    const steps = [0.5,1,2,5,10,15,30,60]; const major = steps.find(s => s * pps >= 70) || 60;
    const minor = major <= 1 ? major / 2 : major / (major % 5 === 0 || major === 15 ? 5 : 2);
    for (let t = 0; t <= duration + 1e-6; t += minor) {
      const x = X(t), isM = Math.abs(t / major - Math.round(t / major)) < 1e-6;
      if (isM) { out.push(line(x, 'gM')); rul += `<text class="t" x="${x + 4}" y="20">${Math.floor(t/60)}:${String(Math.round(t%60*10)/10).padStart(2,'0')}</text><line class="gM" x1="${x}" x2="${x}" y1="14" y2="${RULER_H}"/>`; }
      else if (minor * pps >= 12) { out.push(line(x, 'gn')); rul += `<line class="gm" x1="${x}" x2="${x}" y1="22" y2="${RULER_H}"/>`; }
    }
  } else {
    const beat = 60 / bpm, bar = beat * beats;
    const every = [1,2,4,8,16].find(n => bar * n * pps >= 44) || 16;
    for (let i = 0; ; i++) {
      const t = offset + i * beat; if (t > duration + 1e-6) break; if (t < -1e-6) continue;
      const x = X(t), isBar = i % beats === 0, barNo = Math.floor(i / beats) + 1;
      if (isBar && (barNo - 1) % every === 0) { out.push(line(x, 'gM')); rul += `<text class="t" x="${x + 4}" y="20">${barNo}</text><line class="gM" x1="${x}" x2="${x}" y1="14" y2="${RULER_H}"/>`; }
      else if (isBar) { out.push(line(x, 'gm')); rul += `<line class="gm" x1="${x}" x2="${x}" y1="22" y2="${RULER_H}"/>`; }
      else if (beat * pps >= 14) { out.push(line(x, 'gn')); rul += `<line class="gm" x1="${x}" x2="${x}" y1="26" y2="${RULER_H}"/>`; }
    }
  }
  return { grid: out.join(''), rul };
}

function tracksSvg() {
  const o = [], y0 = i => WAVE_H + i * ROW_H;
  const g = (i, inner) => o.push(`<g transform="translate(0 ${y0(i)})">${inner}</g>`);

  // Flute: 1 Bogen pro Sekunde
  { let p = ''; const n = Math.round(D.fluteEnd - D.fluteStart);
    for (let i = 0; i < n; i++) { const a = X(D.fluteStart + i), b = X(D.fluteStart + i + 1);
      p += `M${a.toFixed(1)} ${ly(0,40).toFixed(1)}A${((b-a)/2).toFixed(1)} ${(18*K).toFixed(1)} 0 0 1 ${b.toFixed(1)} ${ly(0,40).toFixed(1)}`; }
    g(0, `<path class="flute" d="${p}"/>`); }

  // Trumpet: senkrechter Einsatz, dann abfallend
  g(1, D.trumpet.map(([a, b]) => { const x0 = fx(a), x1 = fx(b), m = (x0 + x1) / 2;
    return `<path class="trumpet" d="M${x0} ${ly(1,80)}L${x0} ${ly(1,59)}Q${m} ${ly(1,64)} ${x1} ${ly(1,79)}"/>`; }).join(''));

  // Frog: ansteigende Kurve, dann Abbruch + kleiner Haken
  g(2, D.frog.map(([a, b]) => { const x0 = fx(a), x1 = fx(b), w = x1 - x0;
    return `<path class="frog" d="M${x0} ${ly(2,113)}C${x0 + w*.35} ${ly(2,103)} ${x0 + w*.6} ${ly(2,95)} ${x1 - 2} ${ly(2,94)}L${x1 - 2} ${ly(2,114)}L${x1 + 1} ${ly(2,112)}"/>`; }).join(''));

  // Building: Zickzack, am Ende senkrechter Abbruch
  const zig = (a, b, lo, hi, seed) => { const x0 = fx(a), x1 = fx(b), n = Math.max(6, Math.round((x1 - x0) / (pps * .15)));
    let p = `M${x0} ${ly(3,lo)}`;
    for (let i = 1; i <= n; i++) { const u = i / n, e = Math.min(1, u * 1.6);
      const jitter = ((i * 7 + seed * 5) % 5 - 2) * 1.8 * (1 - e * .75);
      p += `L${(x0 + (x1 - x0) * u).toFixed(1)} ${ly(3, lo + (hi - lo) * e + (i % 2 ? -3 : 3) * (1 - e * .8) + jitter).toFixed(1)}`; }
    return p + `L${x1} ${ly(3,lo)}`; };
  g(3, `<path class="bld g" d="${zig(D.buildingGrey[0], D.buildingGrey[1], 148, 128, 1).replace(/L[\d.]+ [\d.-]+$/, '')}"/>` +
       D.building.map(([a, b], i) => `<path class="bld" d="${zig(a, b, 147, 127, i + 2)}"/>`).join(''));

  // Riser: pinkes Dreieck
  g(4, `<polygon class="riser" points="${fx(D.riser[0])},${ly(4,193)} ${fx(D.riser[1])},${ly(4,165)} ${fx(D.riser[1])},${ly(4,176)} ${fx(D.riser[2])},${ly(4,193)}"/>`);

  // Jagdhorn: Verlauf schwarz -> transparent
  { const a = fx(D.jagd[0]), b = fx(D.jagd[1]);
    g(5, `<defs><linearGradient id="jg" x1="0" x2="1"><stop offset="0" stop-color="var(--ink)"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs>` +
         `<path fill="url(#jg)" d="M${a} ${ly(5,229)}C${a + (b-a)*.55} ${ly(5,228)} ${a + (b-a)*.8} ${ly(5,222)} ${b} ${ly(5,205)}L${b} ${ly(5,229)}Z"/>`); }

  // Drums: Punkte
  { let c = ''; for (let i = 0; i < D.drums.n; i++) c += `<circle class="ink" cx="${X(D.drums.start + i * D.drums.step).toFixed(1)}" cy="${ly(6,247).toFixed(1)}" r="3.6"/>`; g(6, c); }

  // Ringtone: kleine Quadrate (Melodie)
  { let c = ''; const r = D.ring;
    for (let i = 0; i < r.n; i++) { const v = r.pat[i % r.pat.length] + (Math.floor(i / 16) % 2 ? 0 : 0);
      c += `<rect class="ink" x="${(X(r.start + i * r.step) - 2).toFixed(1)}" y="${(ly(7, 285) - v * 2.2 - 2).toFixed(1)}" width="4" height="4"/>`; }
    g(7, c); }

  return o.join('');
}

function markersSvg() {
  const color = { red: 'var(--m-red)', magenta: 'var(--m-magenta)', cyan: 'var(--m-cyan)' };
  let s = D.markers.map(([x, yEnd, c]) => `<line x1="${fx(x)}" x2="${fx(x)}" y1="0" y2="${WAVE_H + (yEnd - 12) * K}" stroke="${color[c]}" stroke-width="1.3"/>`).join('');
  s += `<line x1="${X(duration) - 1}" x2="${X(duration) - 1}" y1="0" y2="${WAVE_H + ROW_H * 5}" stroke="${color.cyan}" stroke-width="1.5"/>`;
  return s;
}

function render() {
  const W = Math.ceil(X(duration)), H = WAVE_H + ROW_H * TRACKS.length;
  stage.style.width = W + 'px'; stage.style.height = RULER_H + H + 'px';
  const { grid, rul } = gridSvg(W);
  let seps = ''; for (let i = 0; i <= TRACKS.length; i++) seps += `<line class="rowsep" x1="0" x2="${W}" y1="${WAVE_H + i * ROW_H - .5}" y2="${WAVE_H + i * ROW_H - .5}"/>`;
  stage.innerHTML =
    `<svg id="ruler" width="${W}" height="${RULER_H}">${rul}<line class="rowsep" x1="0" x2="${W}" y1="${RULER_H - .5}" y2="${RULER_H - .5}"/></svg>` +
    `<div id="wavewrap" style="top:${RULER_H}px;width:${W}px;height:${WAVE_H}px"><canvas id="wave"></canvas><div id="wavemsg" class="${peaks ? 'hide' : ''}"></div></div>` +
    `<svg id="body" style="top:${RULER_H}px" width="${W}" height="${H}">${grid}${seps}${tracksSvg()}${markersSvg()}</svg>` +
    `<div id="shade"></div><div id="playhead"></div>`;
  drawWave(); updateMsg(); tick(true);
}

/* ====================================================================
   Waveform
   ==================================================================== */
function drawWave() {
  const cv = $('wave'); if (!cv) return;
  const W = Math.ceil(X(duration)), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.min(Math.round(W * dpr), 16000);
  cv.width = cw; cv.height = Math.round(WAVE_H * dpr); cv.style.width = W + 'px'; cv.style.height = WAVE_H + 'px';
  if (!peaks) return;
  const c = cv.getContext('2d'), mid = cv.height / 2;
  c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--wave').trim();
  const n = peaks.length / 2;
  for (let px = 0; px < cw; px++) {
    const a = Math.floor(px / cw * n), b = Math.max(a + 1, Math.floor((px + 1) / cw * n));
    let mn = 0, mx = 0;
    for (let i = a; i < b && i < n; i++) { if (peaks[2*i] < mn) mn = peaks[2*i]; if (peaks[2*i+1] > mx) mx = peaks[2*i+1]; }
    c.fillRect(px, mid - mx * mid * .92, 1, Math.max(1, (mx - mn) * mid * .92));
  }
}
function computePeaks(buf) {
  const n = Math.ceil(buf.duration * 250), per = buf.length / n, ch = buf.numberOfChannels;
  const p = new Float32Array(n * 2), data = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  for (let i = 0; i < n; i++) {
    let mn = 0, mx = 0; const s = Math.floor(i * per), e = Math.min(buf.length, Math.floor((i + 1) * per));
    for (let j = s; j < e; j += 2) { let v = 0; for (let k = 0; k < ch; k++) v += data[k][j]; v /= ch; if (v < mn) mn = v; if (v > mx) mx = v; }
    p[2*i] = mn; p[2*i+1] = mx;
  }
  let m = 0; for (const v of p) m = Math.max(m, Math.abs(v)); if (m > 0) for (let i = 0; i < p.length; i++) p[i] /= m;
  return p;
}
async function decode(arrayBuf) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(arrayBuf); ctx.close();
  peaks = computePeaks(buf); drawWave(); updateMsg();
}
function updateMsg() {
  const m = $('wavemsg'); if (!m) return;
  m.classList.toggle('hide', !!peaks);
  if (!peaks) m.innerHTML = window.__waveFail
    ? 'Wellenform braucht einen lokalen Server (start.bat) – oder Datei hier laden: <button id="pick">Audiodatei wählen</button>'
    : 'Wellenform wird berechnet …';
  const b = $('pick'); if (b) b.onclick = () => $('file').click();
}
$('file').onchange = async e => { const f = e.target.files[0]; if (f) { try { await decode(await f.arrayBuffer()); } catch { alert('Datei konnte nicht dekodiert werden.'); } } };
fetch('song.m4a').then(r => r.arrayBuffer()).then(decode).catch(() => { window.__waveFail = true; updateMsg(); });

/* ====================================================================
   Wiedergabe / Playhead
   ==================================================================== */
function toggle() {
  const now = performance.now(); if (now - lastToggle < 200) return; lastToggle = now;
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}
function seek(t) { audio.currentTime = Math.min(Math.max(0, t), duration); tick(true); }

function tick(force) {
  const t = audio.currentTime, x = X(t);
  const ph = $('playhead'), sh = $('shade'); if (!ph) return;
  ph.style.left = x + 'px'; sh.style.width = x + 'px';
  const beat = 60 / bpm, rel = t - offset;
  if (rel < 0) $('clk1').textContent = 'Vorlauf';
  else { const bi = Math.floor(rel / beat); $('clk1').textContent = mode === 'bars'
    ? `Takt ${Math.floor(bi / beats) + 1} · ${bi % beats + 1}` : fmtTime(t); }
  $('clk2').textContent = mode === 'bars' ? fmtTime(t) : (rel < 0 ? '' : `Takt ${Math.floor(Math.floor(rel / beat) / beats) + 1}`);
  if (!audio.paused || force === 'follow') {
    const vw = scroll.clientWidth;
    if (x > scroll.scrollLeft + vw * .85 || x < scroll.scrollLeft) scroll.scrollLeft = x - vw * .15;
  }
}
(function loop() { if (!audio.paused) tick(); requestAnimationFrame(loop); })();
audio.addEventListener('play', () => $('play').classList.add('on'));
audio.addEventListener('pause', () => $('play').classList.remove('on'));
audio.addEventListener('ended', () => $('play').classList.remove('on'));
audio.addEventListener('seeked', () => tick(true));
audio.addEventListener('loadedmetadata', () => { if (isFinite(audio.duration)) { duration = audio.duration; fit(); } });

$('play').onclick = toggle;
$('stop').onclick = () => seek(0);

document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.code === 'Space') return;
  if (e.target.tagName === 'BUTTON' && e.code === 'Space') e.preventDefault();
  if (e.code === 'Space' || e.code === 'MediaPlayPause') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') seek(audio.currentTime + (e.shiftKey ? 5 : 1));
  else if (e.code === 'ArrowLeft') seek(audio.currentTime - (e.shiftKey ? 5 : 1));
  else if (e.code === 'Home') seek(0);
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({ title: 'Blade Runner 20', artist: 'Synthwave goose' });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
}

// Klick / Ziehen = Position setzen
let dragging = false;
const seekFromEvent = e => { const r = stage.getBoundingClientRect(); seek((e.clientX - r.left) / pps); };
stage.addEventListener('pointerdown', e => { dragging = true; stage.setPointerCapture(e.pointerId); seekFromEvent(e); });
stage.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
stage.addEventListener('pointerup', () => dragging = false);

/* ====================================================================
   Zoom, Modus, Theme
   ==================================================================== */
const minPps = () => Math.max(2, scroll.clientWidth / duration), maxPps = () => 160;
function setPps(v, anchorX) {
  const old = pps; pps = Math.min(maxPps(), Math.max(minPps(), v));
  const ax = anchorX ?? scroll.clientWidth / 2, tAnchor = (scroll.scrollLeft + ax) / old;
  render(); scroll.scrollLeft = tAnchor * pps - ax;
  $('zoom').value = Math.round(Math.log(pps / minPps()) / Math.log(maxPps() / minPps()) * 100);
}
function fit() { pps = minPps(); render(); $('zoom').value = 0; }
$('zoom').oninput = e => setPps(minPps() * Math.pow(maxPps() / minPps(), e.target.value / 100));
scroll.addEventListener('wheel', e => {
  if (!e.ctrlKey) return; e.preventDefault();
  setPps(pps * Math.exp(-e.deltaY * .0025), e.clientX - scroll.getBoundingClientRect().left);
}, { passive: false });
window.addEventListener('resize', () => { if (pps < minPps()) fit(); });

function setMode(m) { mode = m; $('m-bars').classList.toggle('on', m === 'bars'); $('m-time').classList.toggle('on', m === 'time');
  $('barset').classList.toggle('hide', m !== 'bars'); render(); try { localStorage.mode = m; } catch {} }
$('m-bars').onclick = () => setMode('bars'); $('m-time').onclick = () => setMode('time');
$('bpm').onchange = e => { bpm = Math.min(300, Math.max(30, +e.target.value || 120)); e.target.value = bpm; render(); };
$('beats').onchange = e => { beats = +e.target.value; render(); };
$('off').onchange = e => { offset = +e.target.value || 0; render(); };

function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.theme = t; } catch {} drawWave(); }
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
{ let t; try { t = localStorage.theme; } catch {} setTheme(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); }

buildLabels(); fit();
// Labels exakt auf Stage-Höhe halten
document.getElementById('labels').style.minHeight = (RULER_H + WAVE_H + ROW_H * TRACKS.length) + 'px';
</script>
</body>
